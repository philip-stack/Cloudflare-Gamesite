name = "philip-stack-rt"
main = "index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Dieselbe D1 wie die Pages-Site — das DrawRoom-DO schreibt die dauerhafte
# Kritzeln-Bestenliste (draw_score) autoritativ am Spielende.
[[d1_databases]]
binding = "DB"
database_name = "wuerfelpoker"
database_id = "1a3ff398-8491-47b4-922b-3d331fcb7366"

# Durable Objects dieses Workers (werden von der Pages-Site gebunden)
[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[durable_objects.bindings]]
name = "TRON_ROOM"
class_name = "TronRoom"

[[durable_objects.bindings]]
name = "DRAW_ROOM"
class_name = "DrawRoom"

[[durable_objects.bindings]]
name = "QUIZ_ROOM"
class_name = "QuizRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TronRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DrawRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["QuizRoom"]

# Cron: alle 2 Minuten den Feuerwehr-Bezirksalarm prüfen (pingt die
# geschützte Pages-Route /api/fire/cron). Secret CRON_TOKEN nötig:
#   echo <token> | npx wrangler secret put CRON_TOKEN -c worker-rt/wrangler.toml
[triggers]
crons = ["*/2 * * * *"]
