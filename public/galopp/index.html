  <meta property="og:url" content="https://philip-stack.pages.dev/galopp/">

  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css?v=3ab868d1">
</head>
<body>
  <main id="app">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Galopp</span></h1>
      <button class="btn-icon" id="btn-pause" title="Pause">⏸️</button>
      <button class="btn-icon" data-theme-toggle></button>
      <button class="btn-icon" id="btn-sound" title="Ton an/aus">🔊</button>
      <button class="btn-icon" id="btn-top" title="Bestenliste">🏆</button>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div class="hud">
        <div class="hud-item"><span id="hud-score">0</span><label>Punkte</label></div>
        <div class="hud-item"><span id="hud-dist">0 m</span><label>Strecke</label></div>
        <div class="hud-item"><span id="hud-coins">0</span><label>Taler</label></div>
      </div>
      <div id="chase-ui">
        <span class="chase-label">🏃</span>
        <div id="chase-bar"><div id="chase-fill"></div><span id="chase-horse">🦄</span></div>
      </div>
      <div id="power-pills"></div>
      <div id="zone-banner" class="hidden"></div>
    </div>
  </main>

  <script src="app.js?v=3efbca0c"></script>
