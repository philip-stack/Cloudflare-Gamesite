<!DOCTYPE html>
<html lang="de-AT" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101017" />
  <script>
    // Theme früh setzen (vor dem ersten Paint) → kein Umblitzen.
    (function () {
      try {
        var t = localStorage.getItem("f1_theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <meta name="robots" content="noindex" />
  <title>Rennticker</title>
  <meta name="description" content="Schlanke Zeitenliste für Formel-1-Rennen – nur die Werte, die zählen." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e10600'/%3E%3Cpath d='M7 22 L15 10 H26 L24 13 H17 L15.5 15.5 H22 L20 18.5 H13.5 L11.5 22 Z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=0c77fe99" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="stripes" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Renn<span>ticker</span></h1>
      </div>
      <button class="icon-btn" id="theme" type="button" title="Hellmodus" aria-label="Hellmodus"></button>
    </header>

    <section class="event">
      <label class="pick">
        <span class="sr">Rennen wählen</span>
        <select id="session" aria-label="Rennen wählen"><option>Lade Kalender …</option></select>
      </label>
      <div class="statusbar">
        <div class="lapbox" id="lapbox"><span class="live-dot" aria-hidden="true"></span><span class="lbl" id="lbl">Runde</span><b id="lap">–</b><span class="of" id="laps"></span></div>
        <div class="flag" id="flag" data-s="pre">–</div>
      </div>
      <p class="note" id="note" hidden></p>
    </section>

    <section class="fav" id="fav" hidden></section>

    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button type="button" role="tab" data-view="times" aria-selected="true">Zeiten</button>
      <button type="button" role="tab" data-view="tyres" aria-selected="false">Reifen</button>
    </div>

    <section class="board" id="board" aria-label="Zeitenliste">
      <div class="head">
        <span class="c-pos">P</span>
        <span class="c-drv">Fahrer</span>
        <button class="c-gap" id="gapmode" type="button" title="Abstand umschalten">Int.</button>
        <span class="c-tyre">Reifen</span>
        <span class="c-stops" title="Boxenstopps">Stopps</span>
        <span class="c-last" id="lasthead">Letzte</span>
      </div>
      <ol class="rows" id="rows"></ol>
      <p class="hint" id="hint">Tipp auf einen Fahrer, um ihn oben zu verfolgen.</p>
    </section>

    <section class="tyres" id="tyres" aria-label="Reifenverlauf aller Fahrer" hidden>
      <div class="tyre-legend" aria-hidden="true">
        <span><i class="tyre t-S">S</i>Soft</span><span><i class="tyre t-M">M</i>Medium</span><span><i class="tyre t-H">H</i>Hard</span>
        <span><i class="tyre t-I">I</i>Inter</span><span><i class="tyre t-W">W</i>Regen</span>
      </div>
      <div class="tyre-head"><span class="t-lbl">Runde</span><div class="axis" id="tyre-axis"></div></div>
      <ol class="trows" id="tyre-rows"></ol>
      <p class="tyre-info" id="tyre-info" aria-live="polite"></p>
    </section>

    <section class="rc" aria-label="Rennleitung">
      <h2>Rennleitung</h2>
      <ul id="msgs"></ul>
      <button class="more" id="more" type="button" hidden>Alle Meldungen</button>
    </section>

    <footer class="foot">
      Live: F1-Live-Timing · Nachschau: <b>OpenF1</b><br />
      Inoffiziell, keine Verbindung zur Formel 1.
    </footer>
  </div>

  <nav class="player" aria-label="Rennverlauf">
    <button class="icon-btn" id="prev" type="button" title="Runde zurück">◀</button>
    <button class="icon-btn play" id="play" type="button" title="Abspielen">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Runde wählen" />
    <button class="icon-btn" id="next" type="button" title="Runde vor">▶</button>
    <button class="icon-btn end" id="end" type="button" title="Zum Ergebnis">⏭</button>
  </nav>

  <script src="model.js?v=ee8a1065"></script>
  <script src="app.js?v=7bb467a2"></script>
</body>
</html>
