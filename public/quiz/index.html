<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta property="og:description" content="Alle raten, Tempo zählt. Echtzeit-Live-Trivia (2–10) — alle beantworten dieselbe Multiple-Choice-Frage gleichzeitig; richtig + schnell = mehr Punkte, Kategorien wählbar, Sieger:in des Abends und dauerhafte Bestenliste.">

  <meta property="og:url" content="https://philip-stack.pages.dev/quiz/">

  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="/shared.js?v=89544a77"></script>
  <link rel="stylesheet" href="style.css?v=f1226996">
</head>
<body>
  <main id="app">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Wer weiß's?</span></h1>
      <button class="btn-icon" data-theme-toggle aria-label="Hell/Dunkel umschalten"></button>
      <button class="btn-icon" id="btn-sound" title="Ton an/aus" aria-label="Ton an/aus">🔊</button>
      <button class="btn-icon" id="btn-top" title="Bestenliste" aria-label="Bestenliste">🏆</button>
      <button class="btn-icon hidden" id="btn-leave" title="Raum verlassen" aria-label="Raum verlassen">🚪</button>
    </div>

    <div id="board" class="hidden">
      <div id="info">
        <span id="i-turn" class="i-turn">—</span>
        <span id="i-cat" class="i-cat"></span>
        <span id="i-time" class="i-time">—</span>
      </div>
      <div id="timebar"><i id="timefill"></i></div>
      <div id="players" class="players"></div>

      <div id="qcard" class="qcard" role="status" aria-live="polite">
        <div id="q-text" class="q-text"></div>
        <div id="q-note" class="q-note"></div>
      </div>

      <div id="options" class="options"></div>

      <div id="tools" class="tools hidden">
        <button class="tool-btn" id="btn-fifty" title="50:50 – zwei falsche Antworten ausblenden">🎲 50:50</button>
        <button class="tool-btn" id="btn-report" title="Frage melden (falsch/strittig)">🚩 Melden</button>
      </div>

      <div id="emotes" class="emotes hidden"></div>
    </div>
  </main>

  <script src="app.js?v=1da03bb8"></script>
</body>
</html>
