<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b16">
  <title>Quiz-Duell</title>
  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/theme.js?v=417502eb"></script>
  <script src="/shared.js?v=fd94d0b4"></script>
  <link rel="stylesheet" href="style.css?v=5f8c7111">
</head>
<body>
  <main id="app">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Quiz-Duell</span></h1>
      <button class="btn-icon" data-theme-toggle></button>
      <button class="btn-icon" id="btn-sound" title="Ton an/aus">🔊</button>
      <button class="btn-icon" id="btn-top" title="Bestenliste">🏆</button>
      <button class="btn-icon hidden" id="btn-leave" title="Raum verlassen">🚪</button>
    </div>

    <div id="board" class="hidden">
      <div id="info">
        <span id="i-turn" class="i-turn">—</span>
        <span id="i-cat" class="i-cat"></span>
        <span id="i-time" class="i-time">—</span>
      </div>
      <div id="timebar"><i id="timefill"></i></div>
      <div id="players" class="players"></div>

      <div id="qcard" class="qcard">
        <div id="q-text" class="q-text"></div>
        <div id="q-note" class="q-note"></div>
      </div>

      <div id="options" class="options"></div>

      <div id="emotes" class="emotes hidden"></div>
    </div>
  </main>

  <script src="app.js?v=69d6b64b"></script>
</body>
</html>
