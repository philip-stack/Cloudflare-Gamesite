<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e0b">
  <title>Spieleabend</title>
  <meta property="og:title" content="Spieleabend">
  <meta property="og:description" content="Zehn Spiele, ein Zuhause — kostenlos, ohne Anmeldung, direkt im Browser. Dein Spieleabend.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://philip-stack.pages.dev/icons/icon-512.png">
  <!-- Hauptschriften (Latin) vorladen → schnelleres erstes Text-Rendern, kein Swap-Ruckler. -->
  <link rel="preload" href="/fonts/outfit-7.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunce-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <link rel="stylesheet" href="/styles/core.css?v=296dc1b7">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/theme.js?v=47979f2b"></script>
  <style>
    /* ============================================================
       SPIELEABEND — Startseite. Basis (Tokens, Ambiente, Komponenten,
       Hellmodus, a11y) kommt aus /styles/core.css. Hier steht NUR
       Startseiten-Eigenes: Hero/Wortmarke, Karten-Grid, Meta-Karten.
       ============================================================ */
    :root { --radius: 18px; }   /* Startseite nutzt etwas rundere Karten */

    main {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 8vh 16px 60px;
    }

    .hero { text-align: center; margin-bottom: 44px; }
    .hero .overline {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 8px;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 800;
      font-size: clamp(2.6rem, 12vw, 3.6rem);
      line-height: 1.1;
      background: var(--foil);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: foil-sheen 5.5s ease-in-out infinite;
    }
    @keyframes foil-sheen {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero .tagline { color: var(--muted); margin-top: 10px; font-size: 0.98rem; }
    /* Wortmarke: eigener Würfel-Merk (SVG) + Schriftzug = echte Identität
       statt Emoji-Only. */
    .wordmark { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .logo-mark { flex-shrink: 0; width: 44px; height: 44px; filter: drop-shadow(0 4px 12px var(--gold-glow)); }
    @media (max-width: 360px) { .logo-mark { width: 38px; height: 38px; } }
    .mascot {
      font-size: 2.6rem; line-height: 1; margin: 6px 0 2px; cursor: pointer; user-select: none;
      display: inline-block; animation: mascot-bob 2.8s ease-in-out infinite;
    }
    .mascot.hop { animation: mascot-hop 0.5s var(--ease-spring); }
    @keyframes mascot-bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    @keyframes mascot-hop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-22px) scale(1.15); } 100% { transform: translateY(0) scale(1); } }
    /* Schnee (nur im Dezember eingeblendet) */
    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .snow i { position: absolute; top: -12px; color: #fff; opacity: 0.85; animation: snow-fall linear infinite; }
    [data-theme="light"] .snow i { color: #cfe0ee; }
    @keyframes snow-fall { to { transform: translateY(105vh) rotate(360deg); } }
    /* Konfetti bei frischem Rekord */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
    .confetti-wrap i { position: absolute; width: 9px; height: 14px; border-radius: 2px; top: -20px; animation: confetti-fall linear forwards; }
    @keyframes confetti-fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0.9; } }

    /* Spiele als 2-spaltiges Kachel-Raster ("App-Store"-Gefühl);
       Meta-/Shortcut-Karten (Profil, Challenge …) laufen über die volle Breite. */
    .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .app-card:not([data-game]) { grid-column: 1 / -1; }

    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: var(--ink);
      background: linear-gradient(175deg, var(--card-hi), var(--card));
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset,
                  0 8px 24px -12px rgba(0,0,0,0.6),
                  0 0 0 1px var(--edge-soft) inset;
      backdrop-filter: blur(10px);
      transition: transform 0.2s var(--ease-spring), box-shadow 0.25s ease;
      animation: rise-in 0.5s var(--ease-spring) both;
      animation-delay: calc(var(--i, 0) * 90ms);
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app-card:hover, .app-card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset,
                  0 14px 34px -12px rgba(0,0,0,0.7),
                  0 0 0 1px var(--edge) inset,
                  0 0 30px -10px var(--gold-glow);
    }
    .app-card:active { transform: scale(0.98); }

    /* Spielkacheln: Icon oben, Text darunter (vertikal), kein Pfeil. */
    .app-card[data-game] {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 15px;
    }
    .app-card[data-game] .app-arrow { display: none; }
    .app-card[data-game] .app-name { font-size: 1.08rem; }
    /* Beschreibung auf 2 Zeilen begrenzen → ruhiges, gleichmäßiges Kachel-Raster.
       !important überschreibt das inline display:block aus der Karten-Vorlage. */
    .app-card[data-game] .app-desc {
      font-size: 0.82rem;
      display: -webkit-box !important;
      -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-icon {
      flex-shrink: 0;
      width: 54px; height: 54px;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      border-radius: 14px;
      /* Akzentfarbe der jeweiligen App (fällt auf Gold zurück) */
      background: color-mix(in srgb, var(--accent, var(--gold)) 15%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, var(--gold)) 42%, transparent) inset;
    }
    .app-info { flex: 1; min-width: 0; }
    .app-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.25rem;
    }
    .app-desc { color: var(--muted); font-size: 0.88rem; margin-top: 3px; line-height: 1.4; }
    .app-arrow {
      flex-shrink: 0;
      color: var(--gold);
      font-size: 1.3rem;
      transition: transform 0.2s var(--ease-spring);
    }
    .app-card:hover .app-arrow { transform: translateX(4px); }

    .app-card.is-last { box-shadow: 0 0 0 1.5px var(--gold, #e8c15a) inset, 0 12px 30px -12px rgba(0,0,0,0.5); }
    .app-card.profile {
      background: linear-gradient(175deg, rgba(232,193,90,0.16), rgba(232,193,90,0.05));
      box-shadow: 0 0 0 1px var(--edge) inset, 0 10px 28px -14px rgba(0,0,0,0.55);
      margin-bottom: 6px;
    }
    .app-card.profile .app-icon { background: rgba(232,193,90,0.2); }
    .app-icon.frame-rainbow { position: relative; }
    .app-icon.frame-rainbow::after {
      content: ""; position: absolute; inset: -3px; border-radius: 16px; padding: 3px;
      background: conic-gradient(#ff5e7a,#ffd23f,#4fd18b,#45cfd6,#5b9cff,#b678ff,#ff5e7a);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
      animation: spin-fr 6s linear infinite; pointer-events: none;
    }
    @keyframes spin-fr { to { transform: rotate(360deg); } }
    .prof-stat { color: var(--gold); font-weight: 700; }
    .app-card.challenge {
      background: linear-gradient(175deg, rgba(90,208,127,0.14), rgba(90,208,127,0.03));
      box-shadow: 0 0 0 1px rgba(90,208,127,0.28) inset, 0 10px 28px -14px rgba(0,0,0,0.55);
      margin-bottom: 6px;
    }
    .app-card.challenge .app-icon { background: rgba(90,208,127,0.18); }
    .chal-done { color: #57e39b; font-weight: 700; }
    .app-card.party {
      background: linear-gradient(175deg, rgba(182,120,255,0.16), rgba(182,120,255,0.04));
      box-shadow: 0 0 0 1px rgba(182,120,255,0.3) inset, 0 10px 28px -14px rgba(0,0,0,0.55);
      margin-bottom: 6px;
    }
    .app-card.party .app-icon { background: rgba(182,120,255,0.2); }
    .app-card.saison {
      background: linear-gradient(175deg, rgba(232,193,90,0.18), rgba(232,193,90,0.04));
      box-shadow: 0 0 0 1px rgba(232,193,90,0.32) inset, 0 10px 28px -14px rgba(0,0,0,0.55);
      margin-bottom: 6px;
    }
    .app-card.saison .app-icon { background: rgba(232,193,90,0.22); }
    /* Grid-Abstand übernimmt gap → alte Einzel-margins entfernen. */
    .apps .app-card { margin-bottom: 0; }
    /* Wettbewerbs-Shortcuts (Challenge/Party/Saison) als schlanke Regale,
       damit die Spiele das Zentrum bleiben und nicht die Meta-Suppe. */
    .app-card.challenge, .app-card.party, .app-card.saison { padding: 13px 16px; }
    .app-card.challenge .app-icon,
    .app-card.party .app-icon,
    .app-card.saison .app-icon { width: 42px; height: 42px; font-size: 1.3rem; border-radius: 11px; }
    .app-card.challenge .app-desc,
    .app-card.party .app-desc,
    .app-card.saison .app-desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Spieleabend-Level-Leiste auf der Profil-Karte */
    .prof-level { display: block; margin-top: 8px; }
    .pl-top { display: flex; align-items: baseline; gap: 6px; font-size: 0.82rem; color: var(--muted); }
    .pl-top b { color: var(--gold); font-size: 0.95rem; }
    .pl-xp { margin-left: auto; font-variant-numeric: tabular-nums; }
    .pl-track { display: block; height: 7px; margin-top: 5px; border-radius: 999px; background: rgba(255,252,240,0.08); overflow: hidden; box-shadow: 0 0 0 1px var(--edge-soft) inset; }
    .pl-track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #c39a30, var(--gold), #fff3c4); transition: width 0.6s var(--ease-spring); }

    /* Tagesquests-Karte */
    .app-card.quests {
      background: linear-gradient(175deg, rgba(69,207,214,0.13), rgba(69,207,214,0.03));
      box-shadow: 0 0 0 1px rgba(69,207,214,0.28) inset, 0 10px 28px -14px rgba(0,0,0,0.55);
      align-items: flex-start;
    }
    .app-card.quests .app-icon { background: rgba(69,207,214,0.18); width: 42px; height: 42px; font-size: 1.3rem; border-radius: 11px; }
    .q-count { font-size: 0.72rem; font-weight: 700; color: var(--gold); background: rgba(232,193,90,0.14); padding: 2px 8px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(232,193,90,0.3) inset; vertical-align: 2px; margin-left: 6px; }
    .quest-lines { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .quest-line { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink); }
    .quest-line.done { color: var(--muted); text-decoration: line-through; }
    .quest-line .ql-ic { flex-shrink: 0; width: 20px; text-align: center; }
    .quest-line .ql-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quest-line .ql-prog { flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.76rem; }

    /* Duell-Einladung (in Akzentfarbe des Spiels) */
    .app-card.duel {
      background: linear-gradient(175deg, color-mix(in srgb, var(--accent, var(--gold)) 20%, transparent), color-mix(in srgb, var(--accent, var(--gold)) 5%, transparent));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, var(--gold)) 45%, transparent) inset, 0 12px 30px -12px rgba(0,0,0,0.6);
    }
    .app-card.duel .app-icon { background: color-mix(in srgb, var(--accent, var(--gold)) 24%, transparent); }

    /* Einblend-Meldung (Level/Quest) */
    .gs-toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px); opacity: 0; z-index: 60;
      max-width: 88vw; padding: 12px 18px; border-radius: 14px;
      font-weight: 700; font-size: 0.95rem; color: #1a1508;
      background: linear-gradient(160deg, #f0cd6e, var(--gold) 45%, #c39a30);
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,230,160,0.4) inset;
      transition: transform 0.35s var(--ease-spring), opacity 0.35s ease;
    }
    .gs-toast.show { transform: translate(-50%, 0); opacity: 1; }

    .game-search {
      width: 100%; margin-bottom: 14px; padding: 13px 16px;
      font-family: inherit; font-size: 0.95rem;
      border: 0; border-radius: 14px;
      background: var(--card); color: var(--ink);
      box-shadow: 0 0 0 1px var(--edge-soft) inset;
    }
    .game-search:focus { outline: none; box-shadow: 0 0 0 1.5px var(--gold) inset; }
    .game-search::placeholder { color: var(--muted); }
    .tools-h { font-family: var(--font-display, inherit); font-size: 1rem; font-weight: 700; color: var(--muted); margin: 22px 4px 10px; letter-spacing: 0.02em; }
    .last-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(232, 193, 90, 0.16);
      color: var(--gold, #e8c15a);
      box-shadow: 0 0 0 1px rgba(232, 193, 90, 0.35) inset;
    }
    .badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: 2px;
      background: rgba(255, 252, 240, 0.06);
      color: var(--muted);
      box-shadow: 0 0 0 1px var(--edge-soft) inset;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 56px;
      letter-spacing: 0.06em;
    }

    /* Startseiten-Deko zusätzlich ruhigstellen (Basis-a11y kommt aus core.css) */
    @media (prefers-reduced-motion: reduce) {
      .mascot, .snow i, .confetti-wrap i { animation: none !important; }
    }
    :root[data-lowpower] .snow { display: none; }
    :root[data-lowpower] .mascot, :root[data-lowpower] .app-icon.frame-rainbow::after { animation: none !important; }

    .app-rec {
      display: block;
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 5px;
    }
    .daily-lead { color: var(--muted); }
    .install-hint {
      position: relative;
      margin-top: 26px;
      padding: 16px 42px 16px 18px;
      border-radius: var(--radius);
      background: linear-gradient(175deg, var(--card-hi), var(--card));
      box-shadow: 0 0 0 1px var(--edge-soft) inset;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .site-footer {
      margin-top: 34px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .site-footer a:hover { color: var(--gold); }
    .install-hint b { color: var(--ink); }
    .install-hint .ih-close {
      position: absolute;
      top: 8px; right: 8px;
      width: 30px; height: 30px;
      border: 0; border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
    }

    .theme-toggle {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      font-size: 1.15rem;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: var(--card-hi);
      color: var(--ink);
      box-shadow: 0 0 0 1px var(--edge-soft) inset, 0 6px 18px -8px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      transition: transform 0.15s var(--ease-spring);
    }
    .theme-toggle:active { transform: scale(0.92); }

    /* ---------- Hellmodus (Tokens/Body/Ambiente kommen aus core.css) ---------- */
    [data-theme="light"] .app-card {
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset,
                  0 8px 24px -14px rgba(40, 50, 40, 0.35),
                  0 0 0 1px var(--edge-soft) inset;
    }
    [data-theme="light"] .badge { background: rgba(35, 45, 35, 0.06); }

    /* Saison-Teaser (aktueller Wochen-Führender) */
    .season-teaser {
      display: flex; align-items: center; gap: 10px; margin: 0 auto 14px; max-width: 640px;
      padding: 11px 15px; border-radius: 14px; text-decoration: none; color: var(--ink);
      background: linear-gradient(100deg, rgba(232,193,90,0.16), rgba(232,193,90,0.04));
      box-shadow: 0 0 0 1px rgba(232,193,90,0.28) inset; font-size: 0.92rem;
      animation: teaser-in 0.5s ease both;
    }
    @keyframes teaser-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .season-teaser:hover { box-shadow: 0 0 0 1px rgba(232,193,90,0.5) inset; }
    .season-teaser .st-crown { font-size: 1.3rem; flex: none; }
    .season-teaser .st-main { flex: 1; min-width: 0; }
    .season-teaser .st-main b { color: var(--gold); }
    .season-teaser .st-lead { font-weight: 700; }
    .season-teaser .st-sub { display: block; font-size: 0.76rem; color: var(--muted); margin-top: 1px; }
    .season-teaser .st-go { flex: none; color: var(--muted); font-size: 1.1rem; }
    @media (prefers-reduced-motion: reduce) { .season-teaser { animation: none; } }
  </style>
</head>
<body>
  <div class="ambience" aria-hidden="true">
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="grain"></div>
  </div>

  <button class="theme-toggle" data-theme-toggle aria-label="Hell/Dunkel umschalten"></button>

  <main>
    <header class="hero">
      <span class="overline" id="greeting">Was spielen wir?</span>
      <div class="wordmark">
        <svg class="logo-mark" viewBox="0 0 48 48" role="img" aria-label="Spieleabend-Logo">
          <defs>
            <linearGradient id="lm-face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1c261e"/>
              <stop offset="1" stop-color="#0d1310"/>
            </linearGradient>
            <linearGradient id="lm-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8a6a1c"/>
              <stop offset="0.5" stop-color="#e8c15a"/>
              <stop offset="1" stop-color="#fff3c4"/>
            </linearGradient>
          </defs>
          <rect x="3.5" y="3.5" width="41" height="41" rx="12" fill="url(#lm-face)" stroke="url(#lm-gold)" stroke-width="2"/>
          <g fill="url(#lm-gold)">
            <circle cx="15" cy="15" r="3.1"/>
            <circle cx="33" cy="15" r="3.1"/>
            <circle cx="24" cy="24" r="3.1"/>
            <circle cx="15" cy="33" r="3.1"/>
            <circle cx="33" cy="33" r="3.1"/>
          </g>
        </svg>
        <h1>Spieleabend</h1>
      </div>
      <p class="tagline">Zehn Spiele, ein Zuhause.</p>
      <div class="mascot" id="mascot" title="Hallo!" aria-hidden="true">🐹</div>
    </header>

    <!-- Saison-Teaser: aktueller Wochen-Führender (aus /api/season), lockt zur Liga -->
    <a class="season-teaser" id="season-teaser" href="/saison/" hidden></a>

    <input type="search" id="game-search" class="game-search" placeholder="🔍 Spiel suchen …" autocomplete="off" aria-label="Spiel suchen">

    <!-- Karten werden aus der zentralen Registry (/games.js) erzeugt -->
    <nav class="apps" id="apps"></nav>


    <!-- Werkzeuge / Neben-Apps (aus der Registry, /games.js) -->
    <h2 class="tools-h" id="tools-h" hidden>🔧 Werkzeuge</h2>
    <nav class="apps" id="tools-nav"></nav>

    <div class="install-hint" id="install-hint" hidden>
      <button class="ih-close" id="ih-close" aria-label="Hinweis ausblenden">✕</button>
      📲 <b>Als App installieren:</b> Android — Chrome-Menü → „App installieren".
      iPhone — in Safari das Teilen-Symbol antippen → <b>„Zum Home-Bildschirm"</b>.
    </div>

    <footer class="site-footer">
      <a href="/impressum/">Impressum</a>
      <span aria-hidden="true">·</span>
      <a href="/datenschutz/">Datenschutz</a>
    </footer>
  </main>

  <script src="/shared.js?v=c53599e3"></script>
  <script src="/games.js?v=645d799d"></script>
  <script>
  // ================= Landing-Dynamik =================
  (function () {
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
    const myName = (localStorage.getItem("bb_name") || "").trim();
    const GAMES = window.GAMES || [];
    const nav = document.querySelector(".apps");
    const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Konfetti-Regen (auch für Level-Aufstieg & Rekord wiederverwendet)
    function fireConfetti() {
      if (reduceMotion()) return;
      const w = document.createElement("div"); w.className = "confetti-wrap";
      const cols = ["#e8c15a", "#ff6f91", "#57e39b", "#5b9cff", "#b678ff", "#ffd23f"];
      let html = "";
      for (let i = 0; i < 70; i++) html += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * 0.6}s;transform:rotate(${Math.random() * 360}deg)"></i>`;
      w.innerHTML = html; document.body.appendChild(w); setTimeout(() => w.remove(), 5200);
    }
    // Kurze Einblend-Meldung unten (Level/Quest)
    function showToast(msg) {
      const t = document.createElement("div"); t.className = "gs-toast"; t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 3400);
    }

    // --- Spielkarten aus der zentralen Registry erzeugen ---
    GAMES.forEach((g, i) => {
      nav.insertAdjacentHTML("beforeend", window.gameCardHTML(g, i));
    });

    // --- Werkzeuge (Neben-Apps) in eigener Sektion ---
    const TOOLS = window.TOOLS || [];
    const toolsNav = document.querySelector("#tools-nav");
    if (TOOLS.length && toolsNav) {
      document.querySelector("#tools-h").hidden = false;
      TOOLS.forEach((t, i) => toolsNav.insertAdjacentHTML("beforeend", window.gameCardHTML(t, i)));
    }

    // --- Saison-Teaser: aktueller Wochen-Führender (dezent, best-effort) ---
    (async function seasonTeaser() {
      const el = $("#season-teaser");
      if (!el) return;
      try {
        const r = await fetch("/api/season");
        if (!r.ok) return;
        const d = await r.json();
        const lead = d.standings && d.standings[0];
        const ms = Math.max(0, d.resetInMs || 0);
        const days = Math.ceil(ms / 86400000);
        const left = ms < 86400000 ? "endet heute" : `noch ${days} Tag${days === 1 ? "" : "e"}`;
        if (lead) {
          el.innerHTML = `<span class="st-crown" aria-hidden="true">👑</span>
            <span class="st-main"><span class="st-lead">Diese Woche führt <b>${esc(lead.name)}</b> · ${lead.points} Pkt</span>
            <span class="st-sub">Saison ${left} — misch mit!</span></span>
            <span class="st-go" aria-hidden="true">→</span>`;
        } else {
          el.innerHTML = `<span class="st-crown" aria-hidden="true">👑</span>
            <span class="st-main"><span class="st-lead">Neue Saison — noch alles offen</span>
            <span class="st-sub">Sei die/der Erste in der Wochen-Liga!</span></span>
            <span class="st-go" aria-hidden="true">→</span>`;
        }
        el.setAttribute("aria-label", "Zur Saison-Liga");
        el.hidden = false;
      } catch (_) { /* offline / kein Netz → Teaser bleibt aus */ }
    })();

    // --- Profil-Karte ganz oben (Gesamtüberblick) ---
    try {
      let badgeSum = 0;
      GAMES.filter(g => g.gsBadges).forEach(g => {
        try { badgeSum += Object.keys(JSON.parse(localStorage.getItem("gs_badges_" + g.key) || "{}").earned || {}).length; } catch {}
      });
      const recordCount = GAMES.filter(g => g.bestKey && Number(localStorage.getItem(g.bestKey) || 0) > 0).length;
      const prof = document.createElement("a");
      prof.className = "app-card profile";
      prof.style.setProperty("--i", 0);
      prof.href = "/profil/";
      const titleName = (localStorage.getItem("gs_title_name") || "").trim();
      const sub = myName
        ? `${titleName ? `<span class="prof-stat">„${esc(titleName)}"</span> · ` : ""}${esc(myName)} · 🏅 ${badgeSum} · ${recordCount} Rekorde`
        : "Name, Abzeichen, Weltränge & dein Spieleabend-Level";
      const avatar = (localStorage.getItem("gs_avatar") || "").trim() || "👤";
      prof.innerHTML = `
        <span class="app-icon">${avatar}</span>
        <span class="app-info">
          <span class="app-name">Mein Profil</span>
          <span class="app-desc" style="display:block">${sub}</span>
        </span>
        <span class="app-arrow">→</span>`;
      // Spieleabend-Level als Fortschrittsleiste (zieht alle Spiele zusammen)
      try {
        if (window.GS && GS.level) {
          const li = GS.level.computeFromGames(window.GAMES);
          const bar = document.createElement("span");
          bar.className = "prof-level";
          bar.innerHTML = `
            <span class="pl-top">Lvl <b>${li.level}</b> · ${esc(li.title)}<span class="pl-xp">${li.into}/${li.need} XP</span></span>
            <span class="pl-track"><i style="width:${Math.max(5, li.pct)}%"></i></span>`;
          prof.querySelector(".app-info").appendChild(bar);
        }
      } catch {}
      // Freigeschalteten Rahmen auf das Profil-Icon anwenden
      const FCOL = { bronze: "#cd7f32", silber: "#bfc7cf", gold: "#e8c15a", smaragd: "#4fd18b", rubin: "#ff5e7a" };
      const fr = localStorage.getItem("gs_frame") || "none";
      const ic = prof.querySelector(".app-icon");
      if (ic && fr === "regenbogen") ic.classList.add("frame-rainbow");
      else if (ic && FCOL[fr]) ic.style.boxShadow = `0 0 0 2.5px ${FCOL[fr]}, 0 0 0 4px rgba(0,0,0,0.25)`;
      nav.insertBefore(prof, nav.firstElementChild);
    } catch {}

    // --- Weiterspielen: laufendes Würfelpoker-Spiel prominent anbieten ---
    try {
      const games = JSON.parse(localStorage.getItem("wp_local_games") || "[]");
      const running = games.find(g => g.status !== "finished");
      if (running) {
        const card = document.createElement("a");
        card.className = "app-card";
        card.style.setProperty("--i", 0);
        card.href = "/wuerfelpoker/#/game/" + running.id;
        card.innerHTML = `
          <span class="app-icon">▶️</span>
          <span class="app-info">
            <span class="app-name">Weiterspielen</span>
            <span class="app-desc" style="display:block">${esc(running.name || "Würfelpoker")} · ${esc((running.players || []).map(p => p.name).join(", "))} · Runde ${running.round || 1}</span>
          </span>
          <span class="app-arrow">→</span>`;
        const nav = document.querySelector(".apps");
        nav.insertBefore(card, nav.firstElementChild);
      }
    } catch { /* kaputte Daten ignorieren */ }

    // --- Zuletzt gespielt: nach oben holen und markieren ---
    try {
      const last = localStorage.getItem("gs_last_game");
      const lastGame = GAMES.find(g => g.key === last);
      if (lastGame) {
        const card = document.querySelector(`.app-card[data-game="${last}"]`);
        if (card && nav) {
          card.classList.add("is-last");
          const tag = document.createElement("span");
          tag.className = "last-tag";
          tag.textContent = "Zuletzt gespielt";
          (card.querySelector(".app-info") || card).appendChild(tag);
          const resume = nav.querySelector(".app-card[href^='/wuerfelpoker/#']");
          nav.insertBefore(card, resume ? resume.nextElementSibling : nav.firstElementChild);
        }
      }
    } catch { /* egal */ }

    // --- Eigene Rekorde + Weltrang pro Spiel (aus der Registry) ---
    for (const g of GAMES) {
      if (!g.bestKey) continue;
      const best = Number(localStorage.getItem(g.bestKey) || 0);
      const info = document.querySelector(`.app-card[data-game="${g.key}"] .app-desc`);
      if (!info || !best) continue;
      const el = document.createElement("span");
      el.className = "app-rec";
      el.textContent = `🏅 Dein Rekord: ${best.toLocaleString("de-AT")}`;
      info.appendChild(el);
      if (myName && g.scored) {
        fetch("/api/scores/" + g.key).then(x => x.json()).then(d => {
          const i = (d.top || []).findIndex(row => row.name.toLowerCase() === myName.toLowerCase());
          if (i >= 0) el.textContent += ` · Weltrang #${i + 1}`;
        }).catch(() => {});
      }
    }

    // --- Heutige Challenge: deterministisches "Spiel des Tages" ---
    try {
      if (GAMES.length) {
        const d = new Date();
        const today = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        let h = 0; for (let i = 0; i < today.length; i++) h = (h * 31 + today.charCodeAt(i)) >>> 0;
        const g = GAMES[h % GAMES.length];
        const done = localStorage.getItem("gs_challenge_done") === today;
        const chal = document.createElement("a");
        chal.className = "app-card challenge";
        chal.style.setProperty("--i", 0);
        chal.href = g.href;
        chal.onclick = () => { try { localStorage.setItem("gs_challenge_done", today); } catch {} };
        chal.innerHTML = `
          <span class="app-icon">🎯</span>
          <span class="app-info">
            <span class="app-name">Heutige Challenge</span>
            <span class="app-desc" style="display:block">Spiel des Tages: <b>${esc(g.name)}</b> ${g.icon}${done ? ` · <span class="chal-done">✓ heute gespielt</span>` : ""}</span>
          </span>
          <span class="app-arrow">→</span>`;
        nav.insertBefore(chal, nav.firstElementChild);
      }
    } catch {}

    // --- Spieleabend-Raum: Einladung zum Party-Modus ---
    try {
      const inRoom = (localStorage.getItem("gs_party_code") || "").trim();
      const party = document.createElement("a");
      party.className = "app-card party";
      party.style.setProperty("--i", 0);
      party.href = "/party/";
      party.innerHTML = `
        <span class="app-icon">🎉</span>
        <span class="app-info">
          <span class="app-name">Spieleabend-Raum</span>
          <span class="app-desc" style="display:block">${inRoom
            ? `Aktiver Raum <b>${esc(inRoom.toUpperCase())}</b> — zur Wertung →`
            : "Mit Freunden zusammen spielen: ein Raum, mehrere Spiele, ein Sieger des Abends 👑"}</span>
        </span>
        <span class="app-arrow">→</span>`;
      const firstGame = nav.querySelector(".app-card[data-game]");
      nav.insertBefore(party, firstGame || null);
    } catch {}

    // --- Saison & Liga: wöchentliche Wertung über alle Spiele ---
    try {
      const saison = document.createElement("a");
      saison.className = "app-card saison";
      saison.style.setProperty("--i", 0);
      saison.href = "/saison/";
      saison.innerHTML = `
        <span class="app-icon">🏆</span>
        <span class="app-info">
          <span class="app-name">Saison &amp; Liga</span>
          <span class="app-desc" style="display:block">Wöchentliche Liga über alle Spiele — Punkte nach Platzierung, jeden Montag neue Saison</span>
        </span>
        <span class="app-arrow">→</span>`;
      const firstGame = nav.querySelector(".app-card[data-game]");
      nav.insertBefore(saison, firstGame || null);
    } catch {}

    // --- Tagesquests: 3 Aufgaben pro Tag, Fortschritt live ---
    try {
      if (window.GS && GS.quests) {
        const qs = GS.quests.today();
        const doneN = qs.filter(q => q.done).length;
        const card = document.createElement("a");
        card.className = "app-card quests";
        card.style.setProperty("--i", 0);
        card.href = "/profil/";
        card.innerHTML = `
          <span class="app-icon">📋</span>
          <span class="app-info">
            <span class="app-name">Tagesquests <span class="q-count">${doneN}/${qs.length}</span></span>
            <span class="quest-lines">${qs.map(q => `
              <span class="quest-line ${q.done ? "done" : ""}">
                <span class="ql-ic">${q.done ? "✅" : q.icon}</span>
                <span class="ql-label">${esc(q.label)}</span>
                <span class="ql-prog">${q.cur}/${q.goal} · +${q.xp}</span>
              </span>`).join("")}</span>
          </span>`;
        const firstGame = nav.querySelector(".app-card[data-game]");
        nav.insertBefore(card, firstGame || null);
      }
    } catch {}

    // --- Duell-Einladung (?duel=game&by=Name&sc=123) prominent zeigen ---
    try {
      const p = new URLSearchParams(location.search);
      const dg = p.get("duel");
      const game = dg && (window.GAMES_BYKEY || {})[dg];
      if (game) {
        const by = (p.get("by") || "Jemand").slice(0, 16) || "Jemand";
        const sc = Math.max(0, parseInt(p.get("sc") || "0", 10) || 0);
        const card = document.createElement("a");
        card.className = "app-card duel";
        card.href = game.href;
        card.style.setProperty("--i", 0);
        card.style.setProperty("--accent", game.accent || "#e8c15a");
        card.innerHTML = `
          <span class="app-icon">${game.icon}</span>
          <span class="app-info">
            <span class="app-name">${esc(by)} fordert dich heraus! ⚔️</span>
            <span class="app-desc" style="display:block">${esc(game.name)} · zu schlagen: <b>${sc.toLocaleString("de-AT")}</b> — tritt an</span>
          </span>
          <span class="app-arrow">→</span>`;
        nav.insertBefore(card, nav.firstElementChild);
      }
    } catch {}

    // --- Suche/Filter über die Spielkarten ---
    try {
      const search = document.getElementById("game-search");
      if (search) search.addEventListener("input", () => {
        const q = search.value.trim().toLowerCase();
        const all = GAMES.concat(window.TOOLS || []);
        document.querySelectorAll(".app-card[data-game]").forEach(card => {
          const g = all.find(x => x.key === card.dataset.game);
          const hit = !q || !g || (g.name + " " + g.desc).toLowerCase().includes(q);
          card.style.display = hit ? "" : "none";
        });
        // Werkzeuge-Überschrift ausblenden, wenn dort nichts mehr sichtbar ist.
        const th = document.getElementById("tools-h");
        if (th) { const any = [...document.querySelectorAll("#tools-nav .app-card")].some(c => c.style.display !== "none"); th.style.display = any ? "" : "none"; }
      });
    } catch {}

    // --- Lebendiger Hub: Gruß, Maskottchen, Deko, Rekord-Konfetti ---
    try {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const now = new Date(), h = now.getHours();
      const greet = h < 5 ? "Gute Nacht" : h < 11 ? "Guten Morgen" : h < 17 ? "Schönen Tag" : h < 22 ? "Guten Abend" : "Gute Nacht";
      const gEl = document.getElementById("greeting");
      if (gEl) gEl.textContent = (myName ? `${greet}, ${myName}` : greet) + " —";

      // Maskottchen hüpft beim Antippen — mit Funken & Ton
      const m = document.getElementById("mascot");
      if (m) m.onclick = () => {
        m.classList.remove("hop"); void m.offsetWidth; m.classList.add("hop");
        try { if (window.GS) { GS.fx.burstAt(m, { count: 12 }); GS.sound.good(); GS.haptic(10); } } catch {}
      };

      // Sanftes Tap-Feedback auf allen Karten (haptisch)
      try { nav.addEventListener("pointerdown", e => { if (e.target.closest(".app-card") && window.GS) GS.haptic(8); }, { passive: true }); } catch {}

      // Schnee im Dezember
      if (!reduce && now.getMonth() === 11) {
        const s = document.createElement("div"); s.className = "snow";
        let html = "";
        for (let i = 0; i < 24; i++) {
          html += `<i style="left:${Math.random() * 100}%;font-size:${8 + Math.random() * 10}px;animation-duration:${6 + Math.random() * 8}s;animation-delay:${-Math.random() * 10}s">❄</i>`;
        }
        s.innerHTML = html; document.body.appendChild(s);
      }

      // Konfetti, wenn gerade ein Rekord aufgestellt wurde
      const cel = Number(localStorage.getItem("gs_celebrate") || 0);
      if (cel) {
        localStorage.removeItem("gs_celebrate");
        if (!reduce && Date.now() - cel < 60000) {
          const w = document.createElement("div"); w.className = "confetti-wrap";
          const cols = ["#e8c15a", "#ff6f91", "#57e39b", "#5b9cff", "#b678ff", "#ffd23f"];
          let html = "";
          for (let i = 0; i < 70; i++) {
            html += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * 0.6}s;transform:rotate(${Math.random() * 360}deg)"></i>`;
          }
          w.innerHTML = html; document.body.appendChild(w);
          if (gEl) gEl.textContent = "🎉 Neuer Rekord!";
          setTimeout(() => w.remove(), 5200);
        }
      }

      // Level-Aufstieg & erledigte Quest feiern (Flags von GS gesetzt)
      try {
        const lu = JSON.parse(localStorage.getItem("gs_levelup") || "null");
        if (lu && Date.now() - lu.at < 60000) {
          localStorage.removeItem("gs_levelup");
          showToast(`⭐ Level ${lu.level} erreicht — ${lu.title}!`);
          fireConfetti();
          try { if (window.GS) { GS.sound.levelup(); GS.fx.burst(innerWidth / 2, innerHeight / 2, { count: 22 }); GS.haptic(20); } } catch {}
        }
        const qd = JSON.parse(localStorage.getItem("gs_quest_done") || "null");
        if (qd && Date.now() - qd.at < 60000) {
          localStorage.removeItem("gs_quest_done");
          showToast(`${qd.icon || "✅"} Quest erledigt · +${qd.xp} XP`);
          try { if (window.GS) { GS.sound.good(); GS.haptic(12); } } catch {}
        }
      } catch {}
    } catch {}

    // --- Profil-Karte immer ganz nach oben (nach allen Einfügungen) ---
    try {
      const pc = nav.querySelector(".app-card.profile");
      if (pc) nav.insertBefore(pc, nav.firstElementChild);
    } catch {}

    // --- Install-Hinweis (nicht in der installierten App, abschaltbar) ---
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (!standalone && !localStorage.getItem("gs_install_hint_off")) {
      $("#install-hint").hidden = false;
      $("#ih-close").onclick = () => {
        localStorage.setItem("gs_install_hint_off", "1");
        $("#install-hint").hidden = true;
      };
    }
  })();
  </script>
</body>
</html>
