<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e0b">
  <title>Tages-Briefing — Spieleabend</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <script src="/theme.js?v=47979f2b"></script>
  <style>
    /* Eigenständige Seite in der Haupt-PWA (gleiches Manifest, gleicher
       Service Worker) — darum die übliche Token-Palette wie bei /datenschutz
       statt eines eigenen Designs. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg0: #0a0e0b; --felt: #0e1410;
      --card: rgba(255,252,240,0.045); --edge: rgba(232,193,90,0.14);
      --ink: #f4efe2; --muted: #93a396; --gold: #e8c15a;
      --foil: linear-gradient(115deg, #8a6a1c 0%, #e8c15a 25%, #fff3c4 50%, #e8c15a 75%, #8a6a1c 100%);
    }
    :root[data-theme="light"] {
      --bg0: #f4f1e6; --felt: #ece9db; --card: rgba(40,48,31,0.05);
      --edge: rgba(120,95,20,0.2); --ink: #26301f; --muted: #64705f; --gold: #a5851f;
      --foil: linear-gradient(115deg, #6d5416 0%, #a5851f 30%, #c9a13b 50%, #a5851f 70%, #6d5416 100%);
    }
    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: radial-gradient(120% 90% at 50% -10%, var(--felt) 0%, var(--bg0) 100%);
      color: var(--ink); min-height: 100dvh; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .btn-back {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
      background: var(--card); color: var(--ink); text-decoration: none; font-size: 1.15rem;
      box-shadow: 0 0 0 1px var(--edge) inset; flex-shrink: 0;
    }
    h1 { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 800; font-size: 1.5rem; flex: 1; }
    .foil {
      background: var(--foil); background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 18px 18px 20px;
      box-shadow: 0 0 0 1px var(--edge) inset; margin-bottom: 14px;
    }
    .lead { font-size: 1.12rem; line-height: 1.55; }
    .meta { color: var(--muted); font-size: 0.78rem; margin-top: 12px; letter-spacing: 0.04em; }
    h2 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--muted); font-weight: 800; margin-bottom: 10px;
    }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.92rem; }
    .kv span { color: var(--muted); }
    .kv b { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
    .hist { list-style: none; }
    .hist li { padding: 11px 0; border-top: 1px solid var(--edge); font-size: 0.9rem; }
    .hist li:first-child { border-top: 0; }
    .hist .d { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.06em; display: block; margin-bottom: 3px; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.92rem; }
    a { color: var(--gold); }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Tages-Briefing</span></h1>
    </div>

    <div id="out" aria-live="polite">
      <div class="card"><p class="empty">lädt…</p></div>
    </div>

    <p class="meta">Zusammengestellt aus E-Control-Preisen, dem NÖ-Einsatzfeed und open-meteo.
      Formuliert von Workers AI — die Zahlen stehen darunter, damit man nachsehen kann.</p>
  </main>

  <script src="app.js?v=38141a11"></script>
</body>
</html>
