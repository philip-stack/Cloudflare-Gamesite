<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <title>Kritzeln &amp; Raten</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/theme.js"></script>
  <script src="/shared.js"></script>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main id="app">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Kritzeln</span></h1>
      <button class="btn-icon" data-theme-toggle></button>
      <button class="btn-icon" id="btn-sound" title="Ton an/aus">🔊</button>
      <button class="btn-icon" id="btn-top" title="Bestenliste">🏆</button>
      <button class="btn-icon hidden" id="btn-leave" title="Raum verlassen">🚪</button>
    </div>

    <div id="board" class="hidden">
      <div id="info">
        <span id="i-turn" class="i-turn">—</span>
        <span id="i-word" class="i-word"></span>
        <span id="i-time" class="i-time">—</span>
      </div>
      <div id="timebar"><i id="timefill"></i></div>
      <div id="players" class="players"></div>

      <div id="cv-wrap">
        <canvas id="paper"></canvas>
        <div id="cv-note" class="cv-note hidden"></div>
      </div>

      <div id="tools" class="tools hidden">
        <div class="swatches" id="swatches"></div>
        <div class="sizes" id="sizes"></div>
        <button class="tool-btn" id="t-clear" title="Leeren">🗑️</button>
      </div>

      <div id="chat" class="chat"></div>
    </div>

    <div id="inputbar" class="inputbar hidden">
      <input id="guess" type="text" maxlength="60" placeholder="Tippe deinen Tipp …" autocomplete="off">
      <button id="guess-send" class="btn-send">➤</button>
    </div>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
