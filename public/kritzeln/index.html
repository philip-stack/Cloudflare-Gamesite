<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <title>Kritzeln &amp; Raten — Spieleabend</title>
  <meta name="description" content="Echtzeit-Multiplayer (2–10) — einer malt, die anderen raten live; Kategorien, Fülleimer/Radierer/Undo, Speed-Punkte, Runden und Sieger:in des Abends.">
  <meta property="og:title" content="🎨 Kritzeln &amp; Raten — Spieleabend">
  <meta property="og:description" content="Einer malt, alle raten. Echtzeit-Multiplayer (2–10) — einer malt, die anderen raten live; Kategorien, Fülleimer/Radierer/Undo, Speed-Punkte, Runden und Sieger:in des Abends.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://philip-stack.pages.dev/kritzeln/">
  <meta property="og:image" content="https://philip-stack.pages.dev/icons/icon-512.png">
  <link rel="stylesheet" href="/fonts/fonts.css?v=8ff75776">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/theme.js?v=89f9deb7"></script>
  <script src="/shared.js?v=89544a77"></script>
  <link rel="stylesheet" href="style.css?v=1203cb11">
</head>
<body>
  <main id="app">
    <div class="topbar">
      <a class="btn-back" href="/" aria-label="Zurück zur Übersicht">←</a>
      <h1><span class="foil">Kritzeln</span></h1>
      <button class="btn-icon" data-theme-toggle aria-label="Hell/Dunkel umschalten"></button>
      <button class="btn-icon" id="btn-sound" title="Ton an/aus" aria-label="Ton an/aus">🔊</button>
      <button class="btn-icon" id="btn-top" title="Bestenliste" aria-label="Bestenliste">🏆</button>
      <button class="btn-icon hidden" id="btn-skip" title="Zug überspringen (Host)" aria-label="Zug überspringen">⏭️</button>
      <button class="btn-icon hidden" id="btn-leave" title="Raum verlassen" aria-label="Raum verlassen">🚪</button>
    </div>

    <div id="board" class="hidden">
      <div id="info">
        <span id="i-turn" class="i-turn">—</span>
        <span id="i-word" class="i-word"></span>
        <span id="i-time" class="i-time">—</span>
      </div>
      <div id="timebar"><i id="timefill"></i></div>
      <div id="players" class="players"></div>

      <div id="cv-wrap">
        <canvas id="paper"></canvas>
        <div id="cv-note" class="cv-note hidden"></div>
      </div>

      <div id="tools" class="tools hidden">
        <div class="swatches" id="swatches"></div>
        <div class="sizes" id="sizes"></div>
        <div class="actions" id="actions">
          <button class="tool-btn" id="t-fill" title="Füllen">🪣</button>
          <button class="tool-btn" id="t-eraser" title="Radierer">⌫</button>
          <button class="tool-btn" id="t-undo" title="Rückgängig">↶</button>
          <button class="tool-btn" id="t-clear" title="Alles löschen">🗑️</button>
        </div>
      </div>

      <div id="emotes" class="emotes hidden"></div>

      <div id="chat" class="chat" role="log" aria-live="polite"></div>
    </div>

    <div id="inputbar" class="inputbar hidden">
      <input id="guess" type="text" maxlength="60" placeholder="Tippe deinen Tipp …" aria-label="Deinen Tipp eingeben" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button id="guess-send" class="btn-send">➤</button>
    </div>
  </main>

  <script src="app.js?v=ccc3be12"></script>
</body>
</html>
