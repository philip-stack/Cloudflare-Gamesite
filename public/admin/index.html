<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0f14" />
  <title>Betrieb · Dashboard</title>
  <style>
    :root { --bg:#0c0f14; --card:#141a22; --line:#26303c; --ink:#eef3f8; --muted:#93a2b4; --accent:#4fd0e0; --ok:#37d38a; --warn:#ffb020; --bad:#ff5b4d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:960px; margin:0 auto; padding:20px 16px 80px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    h1 { font-size:1.2rem; margin:0; letter-spacing:-.01em; } h1 span { color:var(--accent); }
    .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 13px; font:700 .84rem inherit; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.p { background:linear-gradient(160deg,var(--accent),#2ba7b8); color:#04121a; border:0; }
    .btn.bad { color:var(--bad); border-color:rgba(255,91,77,.4); }
    .btn.sm { padding:5px 9px; font-size:.76rem; border-radius:8px; }
    .muted { color:var(--muted); } .mono { font-variant-numeric:tabular-nums; }
    .gate { max-width:420px; margin:12vh auto 0; text-align:center; }
    .gate input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; margin:10px 0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .card h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .big { font-size:1.9rem; font-weight:900; letter-spacing:-.02em; }
    .kv { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:.9rem; }
    .kv b { font-weight:700; }
    .pill { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 9px; border-radius:999px; }
    .pill.ok { background:rgba(55,211,138,.16); color:var(--ok); } .pill.warn { background:rgba(255,176,32,.16); color:var(--warn); } .pill.bad { background:rgba(255,91,77,.16); color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:.82rem; }
    th { text-align:left; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; padding:4px 6px; }
    td { padding:6px 6px; border-top:1px solid var(--line); vertical-align:top; }
    td.t { color:var(--muted); white-space:nowrap; } td.m { word-break:break-word; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .section-title { margin:24px 2px 10px; font-size:.98rem; font-weight:800; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .err { color:var(--bad); } .foot { margin-top:26px; color:var(--muted); font-size:.78rem; }
    .full { grid-column:1/-1; overflow-x:auto; }
    .ampel { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:14px; border:1px solid var(--line); background:var(--card); margin-bottom:14px; }
    .dot { width:14px; height:14px; border-radius:50%; flex:none; box-shadow:0 0 12px currentColor; }
    .dot.ok { color:var(--ok); background:var(--ok); } .dot.warn { color:var(--warn); background:var(--warn); } .dot.bad { color:var(--bad); background:var(--bad); }
    .ampel .txt { font-weight:800; } .ampel .warns { color:var(--muted); font-size:.85rem; font-weight:600; }
    .spark { width:100%; height:44px; display:block; cursor:crosshair; }
    .spark polyline { fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .spark .area { fill:rgba(79,208,224,.12); stroke:none; }
    .spark .marker { stroke:var(--warn); stroke-width:1.5; }
    .sparkbox { position:relative; }
    .sptip { position:absolute; top:-4px; transform:translateX(-50%); background:#0a0e13; border:1px solid var(--line); color:var(--ink); font:800 .74rem inherit; padding:3px 8px; border-radius:7px; white-space:nowrap; pointer-events:none; z-index:6; box-shadow:0 6px 16px rgba(0,0,0,.55); }
    .sparkwrap .lbl { display:flex; justify-content:space-between; font-size:.8rem; margin-top:4px; }
    .switch { display:inline-flex; align-items:center; gap:6px; font-size:.82rem; color:var(--muted); cursor:pointer; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
    input.filter { background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 10px; font:inherit; font-size:.82rem; }
    .dev { font-family:ui-monospace,monospace; font-size:.74rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="gate" hidden>
      <h1>🔒 Betrieb</h1>
      <p class="muted">Zugriffsschlüssel eingeben.</p>
      <input id="key" type="password" placeholder="Schlüssel" autocomplete="off" />
      <button class="btn p" id="enter" style="width:100%">Anmelden</button>
      <p id="gate-msg" class="err" style="min-height:1.2em"></p>
    </div>

    <div id="dash" hidden>
      <header>
        <h1>Betrieb<span>·Dashboard</span></h1>
        <div class="toolbar">
          <label class="switch"><input type="checkbox" id="auto" checked /> Auto</label>
          <button class="btn" id="refresh">↻ Aktualisieren</button>
          <button class="btn" id="logout">Abmelden</button>
        </div>
      </header>
      <div id="ampel" class="ampel"><span class="dot warn"></span><span class="txt">lädt…</span></div>
      <p id="stamp" class="muted mono" style="margin-top:-6px;font-size:.8rem"></p>
      <div id="content"></div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const LS = "admin_key";
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const nf = n => (n == null ? "–" : Number(n).toLocaleString("de-AT"));
    function fmtAge(s) { if (s == null) return "–"; if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min"; if (s < 172800) return Math.round(s / 3600) + " h"; return Math.round(s / 86400) + " d"; }
    const key = () => localStorage.getItem(LS);

    let timer = null, lastData = null, errView = "top", pageFilter = "";
    let trendDays = 30, boardGame = "", boardRows = null, searchQ = "", searchRows = null;

    // Geschützter GET mit Schlüssel-Header (für Unter-Abfragen board/search).
    async function apiGet(params) {
      const r = await fetch("/api/admin?" + params, { headers: { "x-admin-key": key() } });
      if (!r.ok) return null;
      return r.json().catch(() => null);
    }

    async function load() {
      const k = key();
      if (!k) return showGate();
      let r, d;
      try { r = await fetch("/api/admin?days=" + trendDays, { headers: { "x-admin-key": k } }); d = await r.json(); }
      catch { $("#gate-msg") && ($("#gate-msg").textContent = "Netzwerkfehler."); return; }
      if (r.status === 401) { localStorage.removeItem(LS); $("#gate-msg").textContent = "Falscher Schlüssel."; return showGate(); }
      if (!r.ok) return;
      lastData = d; showDash(); render(d);
    }

    function showGate() { $("#dash").hidden = true; $("#gate").hidden = false; $("#key").focus(); stopAuto(); }
    function showDash() { $("#gate").hidden = true; $("#dash").hidden = false; startAuto(); }
    function startAuto() {
      if (timer || !$("#auto").checked) return;
      // Nicht neu laden, während in ein Feld getippt wird (sonst Verlust der Eingabe).
      timer = setInterval(() => { const a = document.activeElement; if (a && a.tagName === "INPUT") return; load(); }, 45000);
    }
    function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }

    // --- geschützte Aktion ---
    async function act(body, confirmMsg, skipReload) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": key() }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert("Fehler: " + (d.error || r.status)); return; }
      if (!skipReload) load();
      return d;
    }

    // --- Bestenliste je Spiel (echte Top-50, mit Löschen) ---
    async function loadBoard() {
      if (!boardGame) { boardRows = null; return renderBoardOut(); }
      const d = await apiGet("board=" + encodeURIComponent(boardGame));
      boardRows = (d && d.rows) || []; renderBoardOut();
    }
    function renderBoardOut() {
      const out = $("#board-out"); if (!out) return;
      if (!boardGame) { out.innerHTML = '<p class="muted">Spiel wählen, um die echte Top-50 zu sehen.</p>'; return; }
      if (!boardRows) { out.innerHTML = '<p class="muted">lädt…</p>'; return; }
      const rows = boardRows.map((x, i) => `<tr><td class="num">${i + 1}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.score)}</td><td class="dev">${esc((x.device || "").slice(0, 12))}…</td><td class="t">${esc((x.created_at || "").slice(0, 10))}</td><td class="num"><button class="btn sm bad" data-delb="${x.id}">🗑</button> <button class="btn sm" data-banb="${esc(x.device || "")}">🚫</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">keine Einträge</td></tr>';
      out.innerHTML = `<table><thead><tr><th class="num">#</th><th>Name</th><th class="num">Score</th><th>Gerät</th><th>Datum</th><th class="num">Aktion</th></tr></thead><tbody>${rows}</tbody></table>`;
      out.querySelectorAll("[data-delb]").forEach(b => b.onclick = async () => { if (!confirm("Diesen Bestenlisten-Eintrag löschen?")) return; await act({ action: "deleteScore", id: Number(b.dataset.delb) }, null, true); loadBoard(); });
      out.querySelectorAll("[data-banb]").forEach(b => b.onclick = async () => { const dev = b.dataset.banb; if (dev && confirm("Gerät sperren und alle seine Scores löschen?")) { await act({ action: "banDevice", device: dev }, null, true); loadBoard(); } });
    }

    // --- Suche nach Name/Gerät ---
    async function loadSearch() {
      if (!searchQ) { searchRows = null; return renderSearchOut(); }
      const d = await apiGet("search=" + encodeURIComponent(searchQ));
      searchRows = (d && d.rows) || []; renderSearchOut();
    }
    function renderSearchOut() {
      const out = $("#search-out"); if (!out) return;
      if (searchRows == null) { out.innerHTML = ""; return; }
      if (!searchRows.length) { out.innerHTML = '<p class="muted">nichts gefunden</p>'; return; }
      const rows = searchRows.map(x => `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td>${esc(x.game)}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.score)}</td><td class="dev">${esc((x.device || "").slice(0, 12))}…</td><td class="num"><button class="btn sm bad" data-dels="${x.id}">🗑</button> <button class="btn sm" data-bans="${esc(x.device || "")}">🚫</button></td></tr>`).join("");
      out.innerHTML = `<table><thead><tr><th>Zeit</th><th>Spiel</th><th>Name</th><th class="num">Score</th><th>Gerät</th><th class="num">Aktion</th></tr></thead><tbody>${rows}</tbody></table>`;
      out.querySelectorAll("[data-dels]").forEach(b => b.onclick = async () => { if (!confirm("Score löschen?")) return; await act({ action: "deleteScore", id: Number(b.dataset.dels) }, null, true); loadSearch(); });
      out.querySelectorAll("[data-bans]").forEach(b => b.onclick = async () => { const dev = b.dataset.bans; if (dev && confirm("Gerät sperren und alle seine Scores löschen?")) { await act({ action: "banDevice", device: dev }, null, true); loadSearch(); } });
    }

    // --- Sparkline (30 Tage, Lücken gefüllt) ---
    function spark(rows) {
      const days = 30, map = new Map((rows || []).map(r => [r.d, r.n]));
      const today = new Date(), series = [];
      for (let i = days - 1; i >= 0; i--) { const dt = new Date(today); dt.setDate(today.getDate() - i); const d = dt.toISOString().slice(0, 10); series.push({ d, v: map.get(d) || 0 }); }
      const max = Math.max(1, ...series.map(p => p.v)), W = 240, H = 44, step = W / (days - 1);
      series.forEach((p, i) => { p.x = +(i * step).toFixed(1); p.y = +(H - 3 - (p.v / max) * (H - 8)).toFixed(1); });
      const pts = series.map(p => `${p.x},${p.y}`);
      const area = `0,${H} ` + pts.join(" ") + ` ${W},${H}`;
      const svg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
        `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>` +
        `<polygon class="area" points="${area}"/><polyline points="${pts.join(" ")}"/>` +
        `<line class="marker" y1="0" y2="${H}" vector-effect="non-scaling-stroke" hidden/></svg>`;
      return { svg, series, last: series[series.length - 1].v, sum: series.reduce((a, b) => a + b.v, 0), max };
    }
    function sparkCard(title, rows, unit) {
      const s = spark(rows);
      return `<div class="card sparkwrap"><h2>${title}</h2>` +
        `<div class="sparkbox" data-series='${JSON.stringify(s.series)}'>${s.svg}<div class="sptip" hidden></div></div>` +
        `<div class="lbl"><span class="muted">30 Tage · Σ ${nf(s.sum)}</span><b class="mono">heute ${nf(s.last)}${unit || ""}</b></div></div>`;
    }
    // Hover/Touch über einer Sparkline: Führungslinie + Tooltip mit Datum & exakter Zahl.
    function attachSparkHover(box) {
      const svg = box.querySelector("svg"), tip = box.querySelector(".sptip"), marker = box.querySelector(".marker");
      let series; try { series = JSON.parse(box.dataset.series); } catch { return; }
      const days = series.length, fmtD = iso => { const p = iso.split("-"); return p[2] + "." + p[1] + "."; };
      function show(clientX) {
        const rect = svg.getBoundingClientRect(); if (!rect.width) return;
        let frac = (clientX - rect.left) / rect.width; frac = Math.max(0, Math.min(1, frac));
        const idx = Math.round(frac * (days - 1)), pt = series[idx];
        marker.setAttribute("x1", pt.x); marker.setAttribute("x2", pt.x); marker.hidden = false;
        tip.hidden = false; tip.textContent = fmtD(pt.d) + " · " + nf(pt.v);
        const box2 = box.getBoundingClientRect();
        tip.style.left = Math.max(26, Math.min(box2.width - 26, clientX - box2.left)) + "px";
      }
      function hide() { tip.hidden = true; marker.hidden = true; }
      svg.addEventListener("mousemove", e => show(e.clientX));
      svg.addEventListener("mouseleave", hide);
      svg.addEventListener("touchstart", e => { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      svg.addEventListener("touchmove", e => { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      svg.addEventListener("touchend", hide);
    }

    function firePill(f) {
      if (f.ageSec == null) return '<span class="pill bad">kein Lauf</span>';
      if (f.note && f.note !== "ok") return '<span class="pill bad">' + esc(f.note) + "</span>";
      if (f.ageSec > 900) return '<span class="pill warn">verzögert</span>';
      return '<span class="pill ok">ok</span>';
    }

    function render(d) {
      // Ampel
      const amp = $("#ampel");
      const cls = d.status === "ok" ? "ok" : d.status === "bad" ? "bad" : "warn";
      amp.innerHTML = `<span class="dot ${cls}"></span><span class="txt">${d.status === "ok" ? "Alles ok" : "Achtung"}</span>` +
        (d.warns && d.warns.length ? `<span class="warns">· ${d.warns.map(esc).join(" · ")}</span>` : "");
      $("#stamp").textContent = "Stand: " + new Date(d.generatedAt).toLocaleString("de-AT");

      const s = d.scores, e = d.errors, p = d.push, f = d.fire, db = d.db, k = d.kritzeln || {};

      const gameRows = (s.games || []).map(g =>
        `<div class="kv"><span>${esc(g.game)} <span class="muted">· ${nf(g.players)} Sp.</span></span><b class="mono">${nf(g.subs)}</b></div>`).join("") || '<p class="muted">keine</p>';
      const topRows = (s.games || []).filter(g => g.top > 0).map(g =>
        `<div class="kv"><span>${esc(g.game)}</span><b class="mono">${nf(g.top)} <span class="muted">${esc(g.topName || "")}</span></b></div>`).join("") || '<p class="muted">keine</p>';

      // Fehler-Ansicht (gruppiert / roh)
      const pages = [...new Set((e.latest || []).map(x => x.page).filter(Boolean))].sort();
      let errBody;
      if (errView === "top") {
        const rows = (e.top || []).filter(x => !pageFilter || x.page === pageFilter);
        errBody = `<table><thead><tr><th class="num">×</th><th>Fehler</th><th>zuletzt</th></tr></thead><tbody>` +
          (rows.map(x => `<tr><td class="num"><b>${nf(x.n)}</b></td><td class="m">${esc(x.msg)}<br><span class="muted">${esc(x.page || "")}</span></td><td class="t">${esc((x.last || "").slice(5, 16))}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">keine Fehler in 24 h 🎉</td></tr>') + `</tbody></table>`;
      } else {
        const rows = (e.latest || []).filter(x => !pageFilter || x.page === pageFilter);
        errBody = `<table><thead><tr><th>Zeit</th><th>Fehler</th></tr></thead><tbody>` +
          (rows.map(x => `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td class="m"><b>${esc(x.msg)}</b><br><span class="muted">${esc(x.page || "")} · ${esc((x.ua || "").slice(0, 60))}</span></td></tr>`).join("") || '<tr><td colspan="2" class="muted">keine</td></tr>') + `</tbody></table>`;
      }
      const pageOpts = `<option value="">alle Seiten</option>` + pages.map(pg => `<option value="${esc(pg)}"${pg === pageFilter ? " selected" : ""}>${esc(pg)}</option>`).join("");

      // Moderation
      const recRows = (d.recent || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td>${esc(x.game)}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.score)}</td><td class="dev">${esc((x.device || "").slice(0, 12))}…</td><td class="num"><button class="btn sm bad" data-del="${x.id}">🗑</button> <button class="btn sm" data-ban="${esc(x.device || "")}">🚫</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">keine</td></tr>';
      const banRows = (d.banned || []).map(x =>
        `<tr><td class="dev">${esc(x.device)}</td><td class="t">${esc((x.at || "").slice(0, 16))}</td><td class="num"><button class="btn sm" data-unban="${esc(x.device)}">entsperren</button></td></tr>`).join("") || '<tr><td colspan="3" class="muted">keine gesperrten Geräte</td></tr>';

      $("#content").innerHTML = `
        <div class="grid">
          <div class="card"><h2>Scores</h2><div class="big mono">${nf(s.total)}</div><div class="kv"><span class="muted">letzte 24 h</span><b class="mono">${nf(s.last24h)}</b></div></div>
          <div class="card"><h2>Interne Fehler (24 h)</h2><div class="big mono ${(e.last24h - e.upstream522) ? "err" : ""}">${nf(e.last24h - e.upstream522)}</div><div class="kv"><span class="muted">extern (522)</span><b class="mono">${nf(e.upstream522)}</b></div></div>
          <div class="card"><h2>Push</h2><div class="big mono">${nf(p.subscriptions)}</div><div class="kv"><span class="muted">Queue</span><b class="mono">${nf(p.queued)}${p.oldestAgeSec != null ? " · " + fmtAge(p.oldestAgeSec) : ""}</b></div></div>
          <div class="card"><h2>Fire-Cron ${firePill(f)}</h2>
            <div class="kv"><span class="muted">letzter Lauf</span><b class="mono">${fmtAge(f.ageSec)}</b></div>
            <div class="kv"><span class="muted">aktive Einsätze</span><b class="mono">${nf(f.active)}</b></div>
            <div class="kv"><span class="muted">gespeichert</span><b class="mono">${nf(f.keptOps)}</b></div>
          </div>
        </div>

        <div class="section-title">📈 Trends
          <span class="toolbar">${[7, 30, 90].map(n => `<button class="btn sm${trendDays === n ? " p" : ""}" data-days="${n}">${n} T</button>`).join("")}</span>
        </div>
        <div class="grid">
          ${sparkCard("Scores / Tag", d.trends.scores)}
          ${sparkCard("Aktive Geräte / Tag", d.trends.devices)}
          ${sparkCard("Fehler / Tag", d.trends.errors)}
        </div>

        <div class="grid" style="margin-top:12px">
          <div class="card"><h2>Einsendungen je Spiel</h2>${gameRows}</div>
          <div class="card"><h2>Weltrekorde</h2>${topRows}</div>
          <div class="card"><h2>DB-Hilfstabellen</h2>
            <div class="kv"><span class="muted">rate-Buckets</span><b class="mono">${nf(db.rateRows)}</b></div>
            <div class="kv"><span class="muted">verbrauchte Token</span><b class="mono">${nf(db.usedTokens)}</b></div>
            <div class="kv"><span class="muted">gesperrte Geräte</span><b class="mono">${nf(db.bannedDevices)}</b></div>
          </div>
          <div class="card"><h2>🎨 Kritzeln &amp; Raten</h2>
            <div class="kv"><span class="muted">Spiele gesamt</span><b class="mono">${nf(k.games)}</b></div>
            <div class="kv"><span class="muted">Spieler:innen</span><b class="mono">${nf(k.players)}</b></div>
            <div class="kv"><span class="muted">Top</span><b class="mono">${k.topName ? esc(k.topName) + " · " + nf(k.topPoints) : "–"}</b></div>
          </div>
        </div>

        <div class="section-title">🐞 Fehler-Log
          <span class="toolbar">
            <select class="filter" id="err-page">${pageOpts}</select>
            <button class="btn sm" id="err-toggle">${errView === "top" ? "Verlauf" : "Gruppiert"}</button>
            <button class="btn sm bad" id="err-522">522 löschen (${nf(e.upstream522)})</button>
            <button class="btn sm bad" id="err-clear">Log leeren</button>
          </span>
        </div>
        <div class="card full">${errBody}</div>

        <div class="section-title">🛡️ Moderation
          <button class="btn sm bad" id="flush-queue">Push-Queue leeren</button>
        </div>
        <div class="card full">
          <table><thead><tr><th>Zeit</th><th>Spiel</th><th>Name</th><th class="num">Score</th><th>Gerät</th><th class="num">Aktion</th></tr></thead>
          <tbody>${recRows}</tbody></table>
        </div>
        <div class="card full" style="margin-top:12px">
          <h2>Gesperrte Geräte</h2>
          <table><tbody>${banRows}</tbody></table>
        </div>

        <div class="section-title">🏆 Bestenliste bereinigen</div>
        <div class="card full">
          <div class="toolbar" style="margin-bottom:8px"><select class="filter" id="board-game">${`<option value="">– Spiel wählen –</option>` + (s.games || []).map(g => `<option value="${esc(g.game)}"${g.game === boardGame ? " selected" : ""}>${esc(g.game)}</option>`).join("")}</select></div>
          <div id="board-out"></div>
        </div>

        <div class="section-title">🔎 Suche (Name / Gerät)</div>
        <div class="card full">
          <div class="toolbar" style="margin-bottom:8px">
            <input class="filter" id="search-q" placeholder="Name oder Geräte-ID…" value="${esc(searchQ)}" style="flex:1;min-width:160px" />
            <button class="btn sm" id="search-go">Suchen</button>
          </div>
          <div id="search-out"></div>
        </div>

        <div class="section-title">⚙️ Aktionen & Alarm</div>
        <div class="card">
          <div class="toolbar" style="margin-bottom:10px">
            <button class="btn" id="trigger-cron">🚒 Fire-Cron jetzt laufen lassen</button>
          </div>
          <label class="muted" style="display:block;font-size:.82rem;margin-bottom:6px">Betreiber-Alarm an Bestenlisten-Namen (leer = aus):</label>
          <div class="toolbar">
            <input class="filter" id="alert-name" placeholder="dein Name" value="${esc(d.alert && d.alert.name || "")}" style="flex:1;min-width:140px" />
            <button class="btn p sm" id="alert-save">Speichern</button>
          </div>
          <p class="muted" style="font-size:.76rem;margin:8px 0 0">Push bei ok→Achtung (Fehlerspitze / Push-Queue-Stau). Voraussetzung: Push im Profil unter genau diesem Namen aktiviert. („Fire-Cron hängt" kann sich nicht selbst melden — dafür das Banner in der App.)</p>
        </div>

        <p class="foot">Rein private Betriebsübersicht. Schreib-Aktionen brauchen den Header-Schlüssel (CSRF-resistent). Kein Tracking Dritter; keine personenbezogenen Daten außer den frei gewählten Bestenlisten-Namen.</p>`;

      wire(e);
      document.querySelectorAll(".sparkbox").forEach(attachSparkHover);
      renderBoardOut(); renderSearchOut();
    }

    function wire(e) {
      $("#err-toggle").onclick = () => { errView = errView === "top" ? "latest" : "top"; render(lastData); };
      $("#err-page").onchange = ev => { pageFilter = ev.target.value; render(lastData); };
      $("#err-522").onclick = () => act({ action: "clear522" }, "Alle 522-Meldungen (externe Quelle) löschen?");
      $("#err-clear").onclick = () => act({ action: "clearErrors" }, "Das GESAMTE Fehler-Log löschen?");
      $("#flush-queue").onclick = () => act({ action: "flushQueue" }, "Push-Warteschlange komplett leeren?");
      $("#trigger-cron").onclick = async () => { const d = await act({ action: "triggerCron" }); if (d) alert("Cron-Status: " + d.cronStatus); };
      document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => act({ action: "deleteScore", id: Number(b.dataset.del) }, "Diesen Score löschen?"));
      document.querySelectorAll("[data-ban]").forEach(b => b.onclick = () => { const dev = b.dataset.ban; if (dev) act({ action: "banDevice", device: dev }, "Dieses Gerät sperren und alle seine Scores löschen?"); });
      document.querySelectorAll("[data-unban]").forEach(b => b.onclick = () => act({ action: "unbanDevice", device: b.dataset.unban }, "Gerät wieder entsperren?"));

      // Trend-Zeitraum
      document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { trendDays = Number(b.dataset.days); load(); });
      // Bestenliste je Spiel
      const bg = $("#board-game"); if (bg) bg.onchange = () => { boardGame = bg.value; boardRows = null; renderBoardOut(); loadBoard(); };
      // Suche
      const sq = $("#search-q"), sgo = $("#search-go");
      const doSearch = () => { searchQ = (sq.value || "").trim(); loadSearch(); };
      if (sgo) sgo.onclick = doSearch;
      if (sq) sq.onkeydown = e => { if (e.key === "Enter") doSearch(); };
      // Betreiber-Alarm speichern
      const asave = $("#alert-save"); if (asave) asave.onclick = async () => { const n = ($("#alert-name").value || "").trim(); const d = await act({ action: "setAlert", name: n }, null, true); if (d) alert(n ? ("Alarm aktiv für: " + n) : "Alarm deaktiviert"); };
    }

    $("#enter").addEventListener("click", () => { const k = $("#key").value.trim(); if (!k) return; localStorage.setItem(LS, k); $("#gate-msg").textContent = ""; load(); });
    $("#key").addEventListener("keydown", e => { if (e.key === "Enter") $("#enter").click(); });
    $("#refresh").addEventListener("click", load);
    $("#logout").addEventListener("click", () => { localStorage.removeItem(LS); showGate(); });
    $("#auto").addEventListener("change", () => { if ($("#auto").checked) startAuto(); else stopAuto(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopAuto(); else if (!$("#dash").hidden) { startAuto(); load(); } });

    load();
  </script>
</body>
</html>
