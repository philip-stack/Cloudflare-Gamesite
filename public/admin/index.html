<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <title>Betrieb · Dashboard</title>
  <style>
    /* ================================================================
       Betriebskonsole — Messgeräte-Optik statt Dashboard-Deko.
       Grundsätze: fast einfarbig, Signalfarben NUR für Status, Zahlen
       durchgehend monospace und rechts ausgerichtet, Haarlinien statt
       schwebender Kacheln, kein Verlauf, kein Leuchten, keine Icons als
       Schmuck. Hell und dunkel folgen dem System.
       ================================================================ */
    :root {
      color-scheme: dark light;
      --bg:#0b0c0d; --panel:#121314; --ink:#e8e6e1; --ink-2:#9a9b97; --ink-3:#6b6d69;
      --line:rgba(232,230,225,.11); --line-2:rgba(232,230,225,.24);
      --ok:#77b45f; --warn:#c9922f; --bad:#cd5442;
      --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
      --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#f6f4ef; --panel:#fffefa; --ink:#191a19; --ink-2:#5a5d59; --ink-3:#85887f;
        --line:rgba(25,26,25,.14); --line-2:rgba(25,26,25,.28);
        --ok:#3d7a2c; --warn:#8a6410; --bad:#a5341f;
      }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 var(--ui); -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1100px; margin:0 auto; padding:0 18px 90px; }

    /* ---------- Kopf (bleibt oben stehen) ---------- */
    header {
      position:sticky; top:0; z-index:20; background:var(--bg);
      border-bottom:1px solid var(--line); margin:0 -18px 4px; padding:12px 18px;
      display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    }
    h1 { margin:0; font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.24em; color:var(--ink); }
    h1 span { color:var(--ink-3); }
    #stamp { font:400 10.5px/1 var(--mono); color:var(--ink-3); letter-spacing:.04em; }

    /* ---------- Knöpfe ---------- */
    .btn {
      font:500 10.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.13em;
      padding:8px 11px; border:1px solid var(--line-2); background:transparent; color:var(--ink);
      border-radius:3px; cursor:pointer;
    }
    .btn:hover { background:var(--panel); border-color:var(--ink-3); }
    .btn.p { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .btn.bad { color:var(--bad); border-color:var(--bad); }
    .btn.sm { padding:6px 8px; font-size:10px; letter-spacing:.1em; }
    :focus-visible { outline:2px solid var(--ink-2); outline-offset:2px; }

    .muted { color:var(--ink-2); }
    .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
    .err { color:var(--bad); }

    /* ---------- Anmeldung ---------- */
    .gate { max-width:320px; margin:18vh auto 0; }
    .gate h1 { margin-bottom:8px; }
    .gate p { color:var(--ink-2); font-size:12px; }
    .gate input {
      width:100%; padding:10px 12px; border-radius:3px; border:1px solid var(--line-2);
      background:var(--panel); color:var(--ink); font:13px/1 var(--mono); margin:12px 0 10px;
    }

    /* ---------- Status-Zeile ---------- */
    .ampel {
      display:flex; align-items:center; gap:11px; padding:11px 14px; margin:14px 0 0;
      background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--ink-3); border-radius:3px;
    }
    .ampel.ok { border-left-color:var(--ok); } .ampel.warn { border-left-color:var(--warn); } .ampel.bad { border-left-color:var(--bad); }
    .dot { width:7px; height:7px; border-radius:1px; flex:none; }
    .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
    .ampel .txt { font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; }
    .ampel .warns { color:var(--ink-2); font-size:12px; }

    /* ---------- Raster aus Haarlinien (keine schwebenden Kacheln) ---------- */
    .grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
      gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px;
      overflow:hidden; margin:18px 0;
    }
    .card { background:var(--bg); border:1px solid var(--line); border-radius:3px; padding:13px 15px 15px; }
    .grid > .card { border:0; border-radius:0; }
    .card h2 {
      margin:0 0 9px; font:500 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.16em;
      color:var(--ink-3); display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .big { font:400 1.7rem/1.1 var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin:2px 0 8px; }
    .kv { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:3px 0; font-size:12px; }
    .kv > span:first-child { color:var(--ink-2); }
    .kv b { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500; }
    .note { color:var(--ink-3); font-size:11px; line-height:1.45; margin:9px 0 0; }

    .pill {
      display:inline-block; font:500 9px/1 var(--mono); text-transform:uppercase; letter-spacing:.14em;
      padding:3px 5px; border:1px solid currentColor; border-radius:2px;
    }
    .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }

    /* ---------- Tabellen ---------- */
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th {
      text-align:left; font:500 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.14em;
      color:var(--ink-3); padding:7px 8px; border-bottom:1px solid var(--line-2); white-space:nowrap;
    }
    td { padding:7px 8px; border-top:1px solid var(--line); vertical-align:top; }
    tbody tr:hover td { background:var(--panel); }
    td.t { font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap; }
    td.m { word-break:break-word; }
    .num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
    .dev { font-family:var(--mono); font-size:11px; color:var(--ink-3); }

    /* ---------- Abschnittsmarken: Text — Linie — Werkzeuge ---------- */
    .section-title {
      margin:26px 0 9px; font:500 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.2em;
      color:var(--ink-2); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .section-title::after { content:""; order:2; flex:1; min-width:24px; height:1px; background:var(--line); }
    .section-title > .toolbar, .section-title > .btn { order:3; }
    .section-title .muted { text-transform:none; letter-spacing:0; font-family:var(--ui); font-size:11px; }
    .full { grid-column:1/-1; overflow-x:auto; }
    .foot { margin-top:28px; color:var(--ink-3); font-size:11px; line-height:1.6; }

    /* ---------- Ansichts-Reiter (zweite Kopfzeile) ---------- */
    .tabs { flex:0 0 100%; display:flex; gap:16px; border-top:1px solid var(--line); margin-top:3px; padding-top:9px; }
    .tab {
      background:none; border:0; padding:0 0 8px; margin-bottom:-10px; cursor:pointer;
      font:500 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.16em;
      color:var(--ink-3); border-bottom:2px solid transparent;
    }
    .tab:hover { color:var(--ink-2); }
    .tab[aria-current="true"] { color:var(--ink); border-bottom-color:var(--ink); }
    .tab .badge { color:var(--warn); margin-left:5px; }

    /* Abschnitt ohne Inhalt: eine Zeile statt einer leeren Tabelle. */
    .quiet {
      margin:0; padding:9px 14px; border:1px solid var(--line); border-radius:3px;
      color:var(--ink-3); font:400 11.5px var(--mono);
    }

    /* ---------- Klappblöcke für selten Gebrauchtes ---------- */
    .fold { border:1px solid var(--line); border-radius:3px; }
    .fold + .fold { margin-top:8px; }
    .fold > summary {
      cursor:pointer; padding:10px 14px; list-style:none;
      font:500 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.16em; color:var(--ink-2);
      display:flex; align-items:center; gap:10px;
    }
    .fold > summary::-webkit-details-marker { display:none; }
    .fold > summary::before { content:"+"; color:var(--ink-3); font-size:12px; line-height:1; }
    .fold[open] > summary::before { content:"–"; }
    .fold > summary .muted { text-transform:none; letter-spacing:0; font-family:var(--ui); font-size:11px; margin-left:auto; }
    .fold > summary:hover { color:var(--ink); }
    .fold-body { padding:0 14px 14px; overflow-x:auto; }
    .fold-body .toolbar { margin-bottom:9px; }

    /* Kontext einer Log-Zeile (extra / UA) — direkt in der Tabellenzelle. */
    .mini { margin-top:4px; }
    .mini > summary { cursor:pointer; list-style:none; font:500 9.5px var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--ink-3); }
    .mini > summary::-webkit-details-marker { display:none; }
    .mini > summary::before { content:"+ "; }
    .mini[open] > summary::before { content:"– "; }
    .mini > summary:hover { color:var(--ink-2); }
    .mini-body { margin-top:5px; padding:7px 9px; border-left:2px solid var(--line-2); font:400 11px/1.5 var(--mono); color:var(--ink-2); word-break:break-word; }
    .mini-body .muted { display:inline-block; min-width:44px; color:var(--ink-3); }

    /* ---------- Verlaufskurven ---------- */
    .spark { width:100%; height:40px; display:block; cursor:crosshair; }
    .spark polyline { fill:none; stroke:var(--ink-2); stroke-width:1.25; stroke-linejoin:round; stroke-linecap:round; }
    .spark .area { fill:var(--line); stroke:none; }
    .spark .marker { stroke:var(--warn); stroke-width:1; }
    .sparkbox { position:relative; }
    .sptip {
      position:absolute; top:-2px; transform:translateX(-50%); background:var(--bg);
      border:1px solid var(--line-2); color:var(--ink); font:500 10.5px var(--mono);
      padding:3px 6px; border-radius:2px; white-space:nowrap; pointer-events:none; z-index:6;
    }
    .sparkwrap .lbl { display:flex; justify-content:space-between; font:400 10.5px var(--mono); color:var(--ink-3); margin-top:3px; }

    /* ---------- Bedienelemente ---------- */
    .switch { display:inline-flex; align-items:center; gap:6px; font:500 10px var(--mono); text-transform:uppercase; letter-spacing:.13em; color:var(--ink-2); cursor:pointer; }
    .toolbar { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
    input.filter, select.filter {
      background:var(--panel); border:1px solid var(--line-2); color:var(--ink);
      border-radius:3px; padding:7px 9px; font:12px/1 var(--mono);
    }

    /* ---------- Tastaturkürzel ---------- */
    #help { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); display:grid; place-items:center; padding:20px; }
    #help[hidden] { display:none; }
    #help .box { background:var(--bg); border:1px solid var(--line-2); border-radius:4px; padding:18px 20px; min-width:260px; }
    #help h2 { margin:0 0 12px; font:500 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; color:var(--ink-3); }
    #help .kv { padding:4px 0; }
    code { font:400 11px var(--mono); color:var(--ink-2); }
    kbd { font:500 11px var(--mono); border:1px solid var(--line-2); border-radius:2px; padding:2px 6px; background:var(--panel); }

    /* Touch: Zeilen-Aktionen größer & auseinander, damit sie am Handy treffbar sind. */
    @media (pointer:coarse) {
      .btn.sm { min-height:40px; padding:9px 11px; }
      td .btn + .btn, .toolbar .btn + .btn { margin-left:5px; }
      td .btn { margin-bottom:4px; }
    }
    /* Schmale Screens: Zeit-Spalte darf umbrechen → Tabellen scrollen weniger. */
    @media (max-width:480px) { td.t { white-space:normal; } header { gap:8px; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="gate" hidden>
      <h1>Spieleabend <span>/ Betrieb</span></h1>
      <p class="muted">Zugriffsschlüssel</p>
      <input id="key" type="password" placeholder="················" autocomplete="off" />
      <button class="btn p" id="enter" style="width:100%">Anmelden</button>
      <p id="gate-msg" class="err" style="min-height:1.2em;font-size:12px"></p>
    </div>

    <div id="dash" hidden>
      <header>
        <h1>Spieleabend <span>/ Betrieb</span></h1>
        <div class="toolbar">
          <span id="stamp"></span>
          <label class="switch"><input type="checkbox" id="auto" checked /> Auto</label>
          <button class="btn" id="refresh" title="Taste R">Laden</button>
          <button class="btn" id="help-btn" title="Tastaturkürzel (?)">?</button>
          <button class="btn" id="logout">Abmelden</button>
        </div>
        <nav class="tabs" id="tabs"></nav>
      </header>
      <div id="ampel" class="ampel"><span class="dot warn"></span><span class="txt">lädt…</span></div>
      <div id="content"></div>
    </div>
  </div>

  <div id="help" hidden>
    <div class="box">
      <h2>Tastaturkürzel</h2>
      <div class="kv"><span>Neu laden</span><b><kbd>R</kbd></b></div>
      <div class="kv"><span>Auto-Aktualisierung</span><b><kbd>A</kbd></b></div>
      <div class="kv"><span>Suche</span><b><kbd>/</kbd></b></div>
      <div class="kv"><span>Ansicht wechseln</span><b><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></b></div>
      <div class="kv"><span>Zeitraum 7 → 30 → 90 Tage</span><b><kbd>T</kbd></b></div>
      <div class="kv"><span>Fehler: gruppiert / Verlauf</span><b><kbd>F</kbd></b></div>
      <div class="kv"><span>Diese Liste</span><b><kbd>?</kbd></b></div>
      <div class="kv"><span>Schließen</span><b><kbd>Esc</kbd></b></div>
      <p class="note">Greifen nur, wenn der Fokus nicht in einem Eingabefeld steht.</p>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const LS = "admin_key";
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const nf = n => (n == null ? "–" : Number(n).toLocaleString("de-AT"));
    // Aufklappbarer Kontext einer Log-Zeile: volles UA + das extra-Feld, das
    // logError() und /api/log seit immer schreiben und das bisher nirgends
    // sichtbar war. Nur zeichnen, wenn es auch etwas zu zeigen gibt.
    function detail(x) {
      const bits = [];
      if (x.extra) bits.push(`<div><span class="muted">extra</span> ${esc(x.extra)}</div>`);
      if (x.ua) bits.push(`<div><span class="muted">ua</span> ${esc(x.ua)}</div>`);
      if (x.page) bits.push(`<div><span class="muted">seite</span> ${esc(x.page)}</div>`);
      if (!bits.length) return "";
      return `<details class="mini"><summary>Kontext</summary><div class="mini-body">${bits.join("")}</div></details>`;
    }

    // "YYYY-MM-DD HH:MM:SS" (UTC, wie SQLite es schreibt) → Alter in ms.
    function tsMs(s) { return Date.parse(String(s || "").replace(" ", "T") + "Z"); }
    function ageMs(s) { const t = tsMs(s); return Number.isFinite(t) ? Date.now() - t : Infinity; }
    function fmtAge(s) { if (s == null) return "–"; if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min"; if (s < 172800) return Math.round(s / 3600) + " h"; return Math.round(s / 86400) + " d"; }
    const key = () => localStorage.getItem(LS);

    // Token aus ?key= übernehmen und die URL sofort säubern — nicht im Browser-
    // Verlauf, in Lesezeichen oder im Referrer hinterlassen.
    (() => { try { const u = new URL(location.href); const k = u.searchParams.get("key"); if (k) { localStorage.setItem(LS, k); u.searchParams.delete("key"); history.replaceState(null, "", u.pathname + u.search + u.hash); } } catch {} })();

    // „Gefährliche" Aktionen: Wort eintippen statt nur OK klicken (Schutz vor Fehlklick).
    function confirmType(word, msg) { const v = prompt(msg + "\n\nZum Bestätigen „" + word + "“ eintippen:"); return v != null && v.trim().toUpperCase() === word; }
    // CSV aus Objektzeilen bauen und als Download anbieten.
    function downloadCsv(filename, rows, cols) {
      const head = cols.map(c => c.label).join(";");
      const esc2 = v => { const s = String(v == null ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const body = (rows || []).map(r => cols.map(c => esc2(r[c.k])).join(";")).join("\n");
      const blob = new Blob([head + "\n" + body], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    let timer = null, lastData = null, errView = "top", pageFilter = "";
    let trendDays = 30, boardGame = "", boardRows = null, searchQ = "", searchRows = null;
    let lastBadges = { fehler: 0, moderation: 0 };   // Reiter-Zähler über einen Ansichtswechsel hinweg

    // Ansichten. Vorher stand alles (14 Abschnitte) untereinander auf einer
    // Seite — gerendert wird jetzt nur die aktive, das spart beim
    // 45-Sekunden-Refresh auch drei Viertel der Arbeit.
    const VIEWS = [["ueberblick", "Überblick"], ["fehler", "Fehler"], ["moderation", "Moderation"], ["system", "System"]];
    const VIEW_IDS = VIEWS.map(v => v[0]);
    const LS_VIEW = "admin_view";
    let view = (() => {
      const fromHash = (location.hash || "").replace("#", "");
      if (VIEW_IDS.includes(fromHash)) return fromHash;
      const saved = localStorage.getItem(LS_VIEW);
      return VIEW_IDS.includes(saved) ? saved : "ueberblick";
    })();
    function setView(v, scroll) {
      if (!VIEW_IDS.includes(v) || v === view) return;
      view = v;
      try { localStorage.setItem(LS_VIEW, v); } catch {}
      // replaceState statt location.hash: ein Hash-Sprung würde die Seite
      // an ein gleichnamiges Element scrollen.
      history.replaceState(null, "", "#" + v);
      // Seit der Endpunkt nach Ansicht lädt (?view=), enthält lastData nur die
      // Daten der VORHERIGEN Ansicht — also nachladen statt neu zeichnen.
      if (lastData) renderTabs(lastBadges.fehler, lastBadges.moderation);   // Reiter sofort umschalten
      load();
      if (scroll) window.scrollTo({ top: 0 });
    }

    // Geschützter GET mit Schlüssel-Header (für Unter-Abfragen board/search).
    async function apiGet(params) {
      const r = await fetch("/api/admin?" + params, { headers: { "x-admin-key": key() } });
      if (!r.ok) return null;
      return r.json().catch(() => null);
    }

    async function load() {
      const k = key();
      if (!k) return showGate();
      let r, d;
      try { r = await fetch("/api/admin?days=" + trendDays + "&view=" + encodeURIComponent(view), { headers: { "x-admin-key": k } }); d = await r.json(); }
      catch { $("#gate-msg") && ($("#gate-msg").textContent = "Netzwerkfehler."); return; }
      if (r.status === 401) { localStorage.removeItem(LS); $("#gate-msg").textContent = "Falscher Schlüssel."; return showGate(); }
      if (!r.ok) return;
      lastData = d; showDash(); render(d);
    }

    function showGate() { $("#dash").hidden = true; $("#gate").hidden = false; $("#key").focus(); stopAuto(); }
    function showDash() { $("#gate").hidden = true; $("#dash").hidden = false; startAuto(); }
    function startAuto() {
      if (timer || !$("#auto").checked) return;
      // Nicht neu laden, während in ein Feld getippt wird (sonst Verlust der Eingabe).
      timer = setInterval(() => { const a = document.activeElement; if (a && a.tagName === "INPUT") return; load(); }, 45000);
    }
    function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }

    // --- geschützte Aktion ---
    async function act(body, confirmMsg, skipReload) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": key() }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert("Fehler: " + (d.error || r.status)); return; }
      if (!skipReload) load();
      return d;
    }

    // --- Bestenliste je Spiel (echte Top-50, mit Löschen) ---
    async function loadBoard() {
      if (!boardGame) { boardRows = null; return renderBoardOut(); }
      const d = await apiGet("board=" + encodeURIComponent(boardGame));
      boardRows = (d && d.rows) || []; renderBoardOut();
    }
    function renderBoardOut() {
      const out = $("#board-out"); if (!out) return;
      if (!boardGame) { out.innerHTML = '<p class="muted">Spiel wählen, um die echte Top-50 zu sehen.</p>'; return; }
      if (!boardRows) { out.innerHTML = '<p class="muted">lädt…</p>'; return; }
      const rows = boardRows.map((x, i) => `<tr><td class="num">${i + 1}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.score)}</td><td class="dev">${esc((x.device || "").slice(0, 12))}…</td><td class="t">${esc((x.created_at || "").slice(0, 10))}</td><td class="num"><button class="btn sm bad" data-delb="${x.id}">🗑</button> <button class="btn sm" data-banb="${esc(x.device || "")}">🚫</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">keine Einträge</td></tr>';

    // --- Suche nach Name/Gerät ---
    async function loadSearch() {

      out.querySelectorAll("[data-bans]").forEach(b => b.onclick = async () => { const dev = b.dataset.bans; if (dev && confirm("Gerät sperren und alle seine Scores löschen?")) { await act({ action: "banDevice", device: dev }, null, true); loadSearch(); } });
    }

    // --- Sparkline (30 Tage, Lücken gefüllt) ---
    // days kommt aus der ANTWORT (d.trends.days), nicht aus der Absicht des
    // Clients: vorher stand hier fest 30, während der Umschalter 7/30/90 an
    // den Server ging — die Kurve zeigte also verlässlich das Falsche.
    function spark(rows, days) {
      const map = new Map((rows || []).map(r => [r.d, r.n]));
      const today = new Date(), series = [];
      for (let i = days - 1; i >= 0; i--) { const dt = new Date(today); dt.setDate(today.getDate() - i); const d = dt.toISOString().slice(0, 10); series.push({ d, v: map.get(d) || 0 }); }
      const max = Math.max(1, ...series.map(p => p.v)), W = 240, H = 44, step = W / Math.max(1, days - 1);
      series.forEach((p, i) => { p.x = +(i * step).toFixed(1); p.y = +(H - 3 - (p.v / max) * (H - 8)).toFixed(1); });
      const pts = series.map(p => `${p.x},${p.y}`);
      const area = `0,${H} ` + pts.join(" ") + ` ${W},${H}`;
      const svg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
        `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>` +
        `<polygon class="area" points="${area}"/><polyline points="${pts.join(" ")}"/>` +
        `<line class="marker" y1="0" y2="${H}" vector-effect="non-scaling-stroke" hidden/></svg>`;
      return { svg, series, last: series[series.length - 1].v, sum: series.reduce((a, b) => a + b.v, 0), max };
    }
    function sparkCard(title, rows, unit, days) {
      const s = spark(rows, days);
      return `<div class="card sparkwrap"><h2>${title}</h2>` +
        `<div class="sparkbox" data-series='${JSON.stringify(s.series)}'>${s.svg}<div class="sptip" hidden></div></div>` +
        `<div class="lbl"><span class="muted">${days} Tage · Σ ${nf(s.sum)}</span><b class="mono">heute ${nf(s.last)}${unit || ""}</b></div></div>`;
    }
    // Hover/Touch über einer Sparkline: Führungslinie + Tooltip mit Datum & exakter Zahl.
    function attachSparkHover(box) {
      const svg = box.querySelector("svg"), tip = box.querySelector(".sptip"), marker = box.querySelector(".marker");
      let series; try { series = JSON.parse(box.dataset.series); } catch { return; }
      const days = series.length, fmtD = iso => { const p = iso.split("-"); return p[2] + "." + p[1] + "."; };
      function show(clientX) {
        const rect = svg.getBoundingClientRect(); if (!rect.width) return;
        let frac = (clientX - rect.left) / rect.width; frac = Math.max(0, Math.min(1, frac));
        const idx = Math.round(frac * (days - 1)), pt = series[idx];
        marker.setAttribute("x1", pt.x); marker.setAttribute("x2", pt.x); marker.hidden = false;
        tip.hidden = false; tip.textContent = fmtD(pt.d) + " · " + nf(pt.v);
        const box2 = box.getBoundingClientRect();
        tip.style.left = Math.max(26, Math.min(box2.width - 26, clientX - box2.left)) + "px";
      }
      function hide() { tip.hidden = true; marker.hidden = true; }
      svg.addEventListener("mousemove", e => show(e.clientX));
      svg.addEventListener("mouseleave", hide);
      svg.addEventListener("touchstart", e => { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      svg.addEventListener("touchmove", e => { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      svg.addEventListener("touchend", hide);
    }

    function firePill(f) {
      if (f.ageSec == null) return '<span class="pill bad">kein Lauf</span>';
      if (f.note && f.note !== "ok") return '<span class="pill bad">' + esc(f.note) + "</span>";
      if (f.ageSec > 900) return '<span class="pill warn">verzögert</span>';
      return '<span class="pill ok">ok</span>';
    }
    function spritPill(s) {
      if (s.ageSec == null) return '<span class="pill warn">kein Lauf</span>';
      if (s.ageSec > 1800) return '<span class="pill warn">verzögert</span>';
      return '<span class="pill ok">ok</span>';
    }

    // Reiter-Leiste. Die Zähler zeigen, dass in einer ANDEREN Ansicht etwas
    // liegt — sonst wäre das Wegräumen von Inhalt ein Verstecken.
    function renderTabs(fehler, meldungen) {
      const badge = { fehler, moderation: meldungen };
      lastBadges = { fehler, moderation: meldungen };
      $("#tabs").innerHTML = VIEWS.map(([id, label]) => {
        const n = badge[id] || 0;
        return `<button class="tab" data-view="${id}" aria-current="${id === view}">${label}${n ? ` <span class="badge">${nf(n)}</span>` : ""}</button>`;
      }).join("");
      $("#tabs").querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view, true));
    }

    function render(d) {
      // „seit … ohne Vorfall" — der Zeitpunkt des letzten Statuswechsels sagt
      // mehr als ein grüner Punkt, der immer grün ist.
      const ops = d.ops || {};
      const ruhe = d.status === "ok" && ops.since && ops.sinceStatus === "ok"
        ? ` · seit ${fmtAge(Math.round(ageMs(ops.since) / 1000))} ohne Vorfall` : "";

      // Ampel
      const amp = $("#ampel");
      const cls = d.status === "ok" ? "ok" : d.status === "bad" ? "bad" : "warn";
      amp.className = "ampel " + cls;      // Signalfarbe sitzt am linken Rand, nicht als Leuchtpunkt
      amp.innerHTML = `<span class="dot ${cls}"></span><span class="txt">${d.status === "ok" ? "Alles ok" : "Achtung"}</span>` +
        (d.warns && d.warns.length ? `<span class="warns">· ${d.warns.map(esc).join(" · ")}</span>` : `<span class="warns">${ruhe}</span>`);
      $("#stamp").textContent = new Date(d.generatedAt).toLocaleTimeString("de-AT");

      const s = d.scores, e = d.errors, p = d.push, f = d.fire, db = d.db, k = d.kritzeln || {}, q = d.quiz || {}, sp = d.sprit || {};
      const rc = d.reach || {};

      const gameRows = (s.games || []).map(g =>
        `<div class="kv"><span>${esc(g.game)} <span class="muted">· ${nf(g.players)} Sp.</span></span><b class="mono">${nf(g.subs)}</b></div>`).join("") || '<p class="muted">keine</p>';
      const topRows = (s.games || []).filter(g => g.top > 0).map(g =>
        `<div class="kv"><span>${esc(g.game)}</span><b class="mono">${nf(g.top)} <span class="muted">${esc(g.topName || "")}</span></b></div>`).join("") || '<p class="muted">keine</p>';

      // Fehler-Ansicht (gruppiert / roh)
      const pages = [...new Set((e.latest || []).map(x => x.page).filter(Boolean))].sort();
      let errBody;
      // Kontext für die GRUPPIERTE Ansicht: die Gruppen-Abfrage kennt kein
      // ua/extra (das hängt an der einzelnen Zeile). Statt dafür je Gruppe
      // eine Unterabfrage über error_log laufen zu lassen, wird der jüngste
      // Treffer aus der ohnehin geladenen Verlaufsliste genommen.
      const errCtx = new Map();
      (e.latest || []).forEach(x => { if (!errCtx.has(x.msg)) errCtx.set(x.msg, x); });

      let errEmpty = false;
      if (errView === "top") {
        const rows = (e.top || []).filter(x => !pageFilter || x.page === pageFilter);
        errEmpty = rows.length === 0;
        errBody = `<table><thead><tr><th class="num">×</th><th>Fehler</th><th>zuletzt</th></tr></thead><tbody>` +
          (rows.map(x => {
            // firstSeen = erstes Auftreten ÜBERHAUPT (nicht im 24-h-Fenster) →
            // damit unterscheidbar wird, was heute neu dazugekommen ist.
            const neu = ageMs(x.firstSeen) < 864e5;
            const alt = x.total > x.n ? ` · ${nf(x.total)} gesamt` : "";
            return `<tr><td class="num"><b>${nf(x.n)}</b></td><td class="m">${neu ? '<span class="pill warn">neu</span> ' : ""}${esc(x.msg)}<br><span class="muted">${esc(x.page || "")}${alt}</span>${detail(errCtx.get(x.msg) || {})}</td><td class="t">${esc((x.last || "").slice(5, 16))}</td></tr>`;
          }).join("") || '<tr><td colspan="3" class="muted">keine Fehler in 24 h 🎉</td></tr>') + `</tbody></table>`;
      } else {
        const rows = (e.latest || []).filter(x => !pageFilter || x.page === pageFilter);
        errEmpty = rows.length === 0;
        errBody = `<table><thead><tr><th>Zeit</th><th>Fehler</th></tr></thead><tbody>` +
          (rows.map(x => `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td class="m"><b>${esc(x.msg)}</b>${detail(x)}</td></tr>`).join("") || '<tr><td colspan="2" class="muted">keine</td></tr>') + `</tbody></table>`;
      }
      const pageOpts = `<option value="">alle Seiten</option>` + pages.map(pg => `<option value="${esc(pg)}"${pg === pageFilter ? " selected" : ""}>${esc(pg)}</option>`).join("");

      // Moderation
      const recRows = (d.recent || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td>${esc(x.game)}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.score)}</td><td class="dev">${esc((x.device || "").slice(0, 12))}…</td><td class="num"><button class="btn sm bad" data-del="${x.id}">löschen</button> <button class="btn sm" data-ban="${esc(x.device || "")}">sperren</button></td></tr>`).join("");
      const banRows = (d.banned || []).map(x =>
        `<tr><td class="dev">${esc(x.device)}</td><td class="t">${esc((x.at || "").slice(0, 16))}</td><td class="num"><button class="btn sm" data-unban="${esc(x.device)}">entsperren</button></td></tr>`).join("");
      const drawRows = (k.entries || []).map((x, i) =>
        `<tr><td class="num">${i + 1}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.points)}</td><td class="num mono">${nf(x.games)}</td><td class="num mono">${nf(x.wins)}</td><td class="num"><button class="btn sm bad" data-drawdel="${esc(x.name)}">löschen</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">keine Einträge</td></tr>';
      const quizRows = (q.entries || []).map((x, i) =>
        `<tr><td class="num">${i + 1}</td><td>${esc(x.name)}</td><td class="num mono">${nf(x.points)}</td><td class="num mono">${nf(x.games)}</td><td class="num mono">${nf(x.wins)}</td><td class="num"><button class="btn sm bad" data-quizdel="${esc(x.name)}">löschen</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">keine Einträge</td></tr>';
      const quizReportRows = (q.reports || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td class="m"><b>${esc((x.msg || "").replace(/^FRAGE GEMELDET: /, ""))}</b><br><span class="muted">${esc(x.extra || "")}</span></td><td class="num"><button class="btn sm" data-reportdel="${x.id}" title="Erledigt / entfernen">erledigt</button></td></tr>`).join("");

      // Live-Räume (aktive Echtzeit-Spiele)
      const GAME_ICON = { quiz: "🧠", kritzeln: "🎨", party: "🎉", funkelfeld: "💎", komet: "☄️", flatterfink: "🐦", sternensturm: "🚀", galopp: "🦄", wumms: "🦝", meeri: "🐹", schlange: "🐍", wuerfelpoker: "🎲", kochstudio: "🍳" };
      const liveRooms = (d.live && d.live.rooms) || [];
      const liveRows = liveRooms.map(x =>
        `<tr><td>${GAME_ICON[x.game] || "🎮"} ${esc(x.game)}</td><td class="mono">${esc(x.code)}</td><td class="num mono">${nf(x.players)}</td><td>${esc(x.state)}</td><td class="t">${esc((x.updated_at || "").slice(11, 16))}</td></tr>`).join("");

      // Client-Fehler (Geräte)
      const ce = d.clientErrors || {};
      const clRows = (ce.latest || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td class="m"><b>${esc(x.msg)}</b>${detail(x)}</td></tr>`).join("");

      // Nutzungszähler (anonym): play/duel/share je Spiel zusammenführen
      const usageMap = {};
      (d.usage || []).forEach(r => {
        const [ev, g] = String(r.k || "").split(":");
        if (!g || !ev) return;
        (usageMap[g] = usageMap[g] || { play: 0, duel: 0, share: 0 })[ev] = r.n;
      });
      const usageRows = Object.entries(usageMap).sort((a, b) => (b[1].play - a[1].play) || (b[1].duel - a[1].duel)).map(([g, u]) =>
        `<tr><td>${GAME_ICON[g] || "🎮"} ${esc(g)}</td><td class="num mono">${nf(u.play)}</td><td class="num mono">${u.duel ? nf(u.duel) : "·"}</td><td class="num mono">${u.share ? nf(u.share) : "·"}</td></tr>`).join("")
        || '<tr><td colspan="4" class="muted">noch keine Nutzungsdaten</td></tr>';

      // Tabellengrößen: absteigend, mit Hinweis was sich selbst aufräumt
      const SELBST = { rate: "selbst", used_token: "selbst", stat_daily: "wächst langsam", push_queue: "nach Zustellung", live_room: "selbst" };
      const tableRows = Object.entries(d.db && d.db.tables || {}).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
        `<tr><td class="mono">${esc(t)}</td><td class="num">${nf(n)}</td><td class="muted">${esc(SELBST[t] || "von Hand")}</td></tr>`).join("")
        || '<tr><td colspan="3" class="muted">keine Daten</td></tr>';

      // Vorfall-Verlauf: Zeilen sind neu→alt, die Dauer eines Vorfalls ist
      // der Abstand zur nächst-NEUEREN Zeile (dem „wieder ok").
      const opsRows = (ops.log || []).map((x, i, arr) => {
        const neuer = arr[i - 1];
        const dauer = x.status !== "warn" ? "·"
          : neuer ? fmtAge(Math.max(0, Math.round((tsMs(neuer.at) - tsMs(x.at)) / 1000)))
            : "läuft";
        return `<tr><td class="t">${esc((x.at || "").slice(0, 16))}</td>` +
          `<td><span class="pill ${x.status === "warn" ? "warn" : "ok"}">${x.status === "warn" ? "Achtung" : "ok"}</span></td>` +
          `<td class="m muted">${esc(x.reasons || "")}</td><td class="num">${dauer}</td></tr>`;
      }).join("");

      // Admin-Audit-Log
      const logRows = (d.adminLog || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td><b>${esc(x.action)}</b> <span class="muted">${esc(x.detail || "")}</span></td></tr>`).join("")
        || '<tr><td colspan="2" class="muted">keine Aktionen protokolliert</td></tr>';

      // Kleine Bausteine: leere Abschnitte werden zu einer Zeile, selten
      // Gebrauchtes zu einem Klappblock. Beides gegen die Endlos-Seite.
      const card = (inner) => `<div class="card full">${inner}</div>`;
      const or = (rows, table, leer) => (rows ? card(table) : `<p class="quiet">${leer}</p>`);
      const fold = (title, inner, sub) =>
        `<details class="fold"><summary>${title}${sub ? `<span class="muted">${sub}</span>` : ""}</summary><div class="fold-body">${inner}</div></details>`;
      const title = (t, tools) => `<div class="section-title">${t}${tools || ""}</div>`;

      const errCount = e.last24h - e.upstream522;
      const V = {};

      // ---------- ÜBERBLICK: was täglich zählt ----------
      V.ueberblick = `
        <div class="grid">
          <div class="card"><h2>Reichweite</h2>
            <div class="big mono">${nf(rc.players)}</div>
            <div class="kv"><span>aktiv · 7 Tage</span><b>${nf(rc.active7)}</b></div>
            <div class="kv"><span>neu · 7 Tage</span><b>${nf(rc.new7)}</b></div>
            <div class="kv"><span>an ≥ 2 Tagen da</span><b>${nf(rc.returning)}</b></div>
            <p class="note">Gezählt werden verschiedene Bestenlisten-Namen — die beste Näherung für „Menschen", die ohne Mitschneiden möglich ist.</p>
          </div>
          <div class="card"><h2>Scores</h2><div class="big mono">${nf(s.total)}</div><div class="kv"><span>letzte 24 h</span><b>${nf(s.last24h)}</b></div></div>
          <div class="card"><h2>Interne Fehler (24 h)</h2><div class="big mono ${errCount ? "err" : ""}">${nf(errCount)}</div><div class="kv"><span>extern (522)</span><b>${nf(e.upstream522)}</b></div></div>
        </div>

        ${title("Trends", `<span class="toolbar">${[7, 30, 90].map(n => `<button class="btn sm${trendDays === n ? " p" : ""}" data-days="${n}">${n} T</button>`).join("")}</span>`)}
        <div class="grid">
          ${sparkCard("Scores / Tag", d.trends.scores, "", d.trends.days)}
          ${sparkCard("Aktive Geräte / Tag", d.trends.devices, "", d.trends.days)}
          ${sparkCard("Fehler / Tag", d.trends.errors, "", d.trends.days)}
        </div>

        ${title("Nutzung", `<span class="muted">anonym · letzte ${d.trends.days} Tage</span>`)}
        <div class="grid">
          <div class="card full"><h2>Was wird gespielt — Starts · Duelle · Teilen</h2>
            <table><thead><tr><th>Spiel</th><th class="num">Starts</th><th class="num">Duelle</th><th class="num">Teilen</th></tr></thead><tbody>${usageRows}</tbody></table>
            <p class="note">„Starts" = gespielte Runden (anonym). „Duelle" = über einen Herausforderungs-Link gestartet. „Teilen" = Teilen-Karte erzeugt. Ganz ohne Personenbezug.</p>
          </div>
        </div>

        ${title("Aktive Räume", `<span class="muted">Live-Spiele gerade</span>`)}
        ${or(liveRows, `<table><thead><tr><th>Spiel</th><th>Code</th><th class="num">Spieler</th><th>Phase</th><th>seit</th></tr></thead><tbody>${liveRows}</tbody></table>`, "gerade keine aktiven Räume")}

        <div class="grid" style="margin-top:18px">
          <div class="card"><h2>Einsendungen je Spiel</h2>${gameRows}</div>
          <div class="card"><h2>Weltrekorde</h2>${topRows}</div>
          <div class="card"><h2>Kritzeln &amp; Raten</h2>
            <div class="kv"><span>Spiele gesamt</span><b>${nf(k.games)}</b></div>
            <div class="kv"><span>Spieler:innen</span><b>${nf(k.players)}</b></div>
            <div class="kv"><span>Top</span><b>${k.topName ? esc(k.topName) + " · " + nf(k.topPoints) : "–"}</b></div>
          </div>
          <div class="card"><h2>Wer weiß's?</h2>
            <div class="kv"><span>Spiele gesamt</span><b>${nf(q.games)}</b></div>
            <div class="kv"><span>Spieler:innen</span><b>${nf(q.players)}</b></div>
            <div class="kv"><span>Top</span><b>${q.topName ? esc(q.topName) + " · " + nf(q.topPoints) : "–"}</b></div>
            <div class="kv"><span>gemeldete Fragen</span><b>${nf(q.reportCount)}</b></div>
          </div>
        </div>`;

      // ---------- FEHLER ----------
      V.fehler = `
        ${title("Fehler-Log", `<span class="toolbar">
            <select class="filter" id="err-page">${pageOpts}</select>
            <button class="btn sm" id="err-toggle">${errView === "top" ? "Verlauf" : "Gruppiert"}</button>
            <button class="btn sm bad" id="err-522">522 löschen (${nf(e.upstream522)})</button>
            <button class="btn sm bad" id="err-clear">Log leeren</button>
          </span>`)}
        ${errEmpty ? `<p class="quiet">keine Fehler in 24 h${pageFilter ? " auf „" + esc(pageFilter) + "“" : ""}</p>` : card(errBody)}

        ${title("Client-Fehler", `<span class="muted">Geräte · ${nf(ce.last24h)} in 24 h / ${nf(ce.total)} gesamt</span>`)}
        ${or(clRows, `<table><thead><tr><th>Zeit</th><th>Fehler (Gerät)</th></tr></thead><tbody>${clRows}</tbody></table>`, "keine Client-Fehler")}

        ${title("Gemeldete Fragen", `<button class="btn sm bad" id="quiz-reports-clear">Meldungen leeren</button>`)}
        ${or(quizReportRows, `<table><thead><tr><th>Zeit</th><th>Frage &amp; Kontext</th><th class="num">Aktion</th></tr></thead><tbody>${quizReportRows}</tbody></table>`, "keine gemeldeten Fragen")}`;

      // ---------- MODERATION ----------
      V.moderation = `
        ${title("Letzte Einsendungen")}
        ${or(recRows, `<table><thead><tr><th>Zeit</th><th>Spiel</th><th>Name</th><th class="num">Score</th><th>Gerät</th><th class="num">Aktion</th></tr></thead><tbody>${recRows}</tbody></table>`, "keine Einsendungen")}

        ${title("Suche · Name oder Gerät")}
        <div class="card full">
          <div class="toolbar" style="margin-bottom:9px">
            <input class="filter" id="search-q" placeholder="Name oder Geräte-ID…" value="${esc(searchQ)}" style="flex:1;min-width:160px" />
            <button class="btn sm" id="search-go">Suchen</button>
          </div>
          <div id="search-out"></div>
        </div>

        ${title("Bestenlisten bereinigen")}
        ${fold("Scores je Spiel",
          `<div class="toolbar"><select class="filter" id="board-game">${`<option value="">– Spiel wählen –</option>` + (s.games || []).map(g => `<option value="${esc(g.game)}"${g.game === boardGame ? " selected" : ""}>${esc(g.game)}</option>`).join("")}</select></div><div id="board-out"></div>`,
          "echte Top-50, mit Löschen")}
        ${fold("Kritzeln &amp; Raten",
          `<div class="toolbar"><button class="btn sm" id="draw-csv">CSV</button><button class="btn sm bad" id="draw-clear">Alle löschen</button></div>
           <table><thead><tr><th class="num">#</th><th>Name</th><th class="num">Punkte</th><th class="num">Spiele</th><th class="num">Siege</th><th class="num">Aktion</th></tr></thead><tbody>${drawRows}</tbody></table>`,
          `${nf(k.players)} Einträge`)}
        ${fold("Wer weiß's?",
          `<div class="toolbar"><button class="btn sm" id="quiz-csv">CSV</button><button class="btn sm bad" id="quiz-clear">Alle löschen</button></div>
           <table><thead><tr><th class="num">#</th><th>Name</th><th class="num">Punkte</th><th class="num">Spiele</th><th class="num">Siege</th><th class="num">Aktion</th></tr></thead><tbody>${quizRows}</tbody></table>`,
          `${nf(q.players)} Einträge`)}
        ${fold("Gesperrte Geräte",
          banRows ? `<table><tbody>${banRows}</tbody></table>` : '<p class="quiet">keine gesperrten Geräte</p>',
          `${nf(db.bannedDevices)}`)}`;

      // ---------- SYSTEM ----------
      V.system = `
        <div class="grid">
          <div class="card"><h2>Fire-Cron ${firePill(f)}</h2>
            <div class="kv"><span>letzter Lauf</span><b>${fmtAge(f.ageSec)}</b></div>
            <div class="kv"><span>aktive Einsätze</span><b>${nf(f.active)}</b></div>
            <div class="kv"><span>gespeichert</span><b>${nf(f.keptOps)}</b></div>
          </div>
          <div class="card"><h2>Sprit-Cron ${spritPill(sp)}</h2>
            <div class="kv"><span>letzter Lauf</span><b>${fmtAge(sp.ageSec)}</b></div>
            <div class="kv"><span>aktive Alarme</span><b>${nf(sp.alerts)} · ${nf(sp.subscribers)} Abos</b></div>
            <div class="kv"><span>Preis-Log</span><b>${nf(sp.priceLog)}</b></div>
          </div>
          <div class="card"><h2>Push</h2><div class="big mono">${nf(p.subscriptions)}</div>
            <div class="kv"><span>Queue</span><b>${nf(p.queued)}${p.oldestAgeSec != null ? " · " + fmtAge(p.oldestAgeSec) : ""}</b></div>
            <button class="btn sm bad" id="flush-queue" style="margin-top:9px">Push-Queue leeren</button>
          </div>
        </div>

        ${title("Aktionen &amp; Alarm")}
        <div class="card full">
          <div class="toolbar" style="margin-bottom:11px">
            <button class="btn" id="trigger-cron">Fire-Cron auslösen</button>
            <button class="btn" id="trigger-sprit">Sprit-Cron auslösen</button>
          </div>
          <label class="muted" style="display:block;font-size:12px;margin-bottom:7px">Betreiber-Alarm an Bestenlisten-Namen (leer = aus):</label>
          <div class="toolbar">
            <input class="filter" id="alert-name" placeholder="dein Name" value="${esc(d.alert && d.alert.name || "")}" style="flex:1;min-width:140px" />
            <button class="btn p sm" id="alert-save">Speichern</button>
          </div>
          <p class="note">Push bei ok→Achtung und zurück — mit derselben Bewertung wie die Statuszeile oben (Fehlerspitze, Push-Stau, hängende Crons, Fire-Notiz, VAPID). Fehler werden dafür im 15-Minuten-Fenster gemessen, in der Anzeige über 24 Stunden. Voraussetzung: Push im Profil unter genau diesem Namen aktiviert. („Fire-Cron hängt" kann sich nicht selbst melden — dafür die Statuszeile.)</p>
        </div>

        ${title("Tabellen", `<span class="muted">Zeilen je Tabelle — was unbemerkt wächst</span>`)}
        <div class="card full">
          <table><thead><tr><th>Tabelle</th><th class="num">Zeilen</th><th>Aufräumen</th></tr></thead>
          <tbody>${tableRows}</tbody></table>
          <p class="note">D1 im Gratis-Tarif: 5 Mio. gelesene Zeilen pro Tag. <code>rate</code> und <code>used_token</code> räumen sich selbst ab, <code>error_log</code> und <code>client_log</code> nur über die Knöpfe in der Fehler-Ansicht, <code>sprit_price_log</code> und <code>fire_op</code> wachsen dauerhaft mit.</p>
        </div>

        ${fold("Vorfall-Verlauf",
          opsRows
            ? `<table><thead><tr><th>Zeitpunkt (UTC)</th><th>Status</th><th>Grund</th><th class="num">Dauer</th></tr></thead><tbody>${opsRows}</tbody></table>
               <p class="note">Eine Zeile je Statuswechsel, geschrieben vom Cron — unabhängig davon, ob ein Alarm-Name gesetzt ist.</p>`
            : '<p class="quiet">noch kein Statuswechsel aufgezeichnet</p>',
          ops.since ? `letzter Wechsel vor ${fmtAge(Math.round(ageMs(ops.since) / 1000))}` : "")}
        ${fold("Admin-Protokoll",
          `<table><thead><tr><th>Zeit</th><th>Aktion</th></tr></thead><tbody>${logRows}</tbody></table>`,
          "letzte 40 Aktionen · inkl. auth:fail")}`;

      renderTabs(errCount + ce.last24h, q.reportCount);
      $("#content").innerHTML = (V[view] || V.ueberblick) +
        `<p class="foot">Rein private Betriebsübersicht. Schreib-Aktionen brauchen den Header-Schlüssel (CSRF-resistent). Fehlgeschlagene Anmeldungen stehen als <b>auth:fail</b> im Admin-Protokoll (Ansicht System). Kein Tracking Dritter; keine personenbezogenen Daten außer den frei gewählten Bestenlisten-Namen. · Tastaturkürzel: <kbd>?</kbd></p>`;

      wire(e);
      document.querySelectorAll(".sparkbox").forEach(attachSparkHover);
      renderBoardOut(); renderSearchOut();
    }

    // Seit es Ansichten gibt, existiert je Aufruf nur ein Teil der Elemente —
    // darum wird jeder Draht einzeln geprüft statt blind gesetzt.
    function wire(e) {
      const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
      on("#err-toggle", () => { errView = errView === "top" ? "latest" : "top"; render(lastData); });
      const ep = $("#err-page"); if (ep) ep.onchange = ev => { pageFilter = ev.target.value; render(lastData); };
      on("#err-522", () => act({ action: "clear522" }, "Alle 522-Meldungen (externe Quelle) löschen?"));
      on("#err-clear", () => { if (confirmType("LÖSCHEN", "Das GESAMTE Fehler-Log löschen?")) act({ action: "clearErrors" }); });
      on("#flush-queue", () => { if (confirmType("LÖSCHEN", "Push-Warteschlange komplett leeren?")) act({ action: "flushQueue" }); });
      on("#trigger-cron", async () => { const d = await act({ action: "triggerCron" }); if (d) alert("Fire-Cron-Status: " + d.cronStatus); });
      const ts = $("#trigger-sprit"); if (ts) ts.onclick = async () => { const d = await act({ action: "triggerCron", which: "sprit" }); if (d) alert("Sprit-Cron: " + d.cronStatus + " · geprüft " + ((d.result && d.result.checked) ?? "–") + ", gesendet " + ((d.result && d.result.sent) ?? "–")); };
      document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => act({ action: "deleteScore", id: Number(b.dataset.del) }, "Diesen Score löschen?"));
      document.querySelectorAll("[data-ban]").forEach(b => b.onclick = () => { const dev = b.dataset.ban; if (dev) act({ action: "banDevice", device: dev }, "Dieses Gerät sperren und alle seine Scores löschen?"); });
      document.querySelectorAll("[data-unban]").forEach(b => b.onclick = () => act({ action: "unbanDevice", device: b.dataset.unban }, "Gerät wieder entsperren?"));
      // Kritzeln-Bestenliste bereinigen
      const dc = $("#draw-clear"); if (dc) dc.onclick = () => { if (confirmType("LÖSCHEN", "Die GESAMTE Kritzeln-Bestenliste löschen?")) act({ action: "clearDraw" }); };
      document.querySelectorAll("[data-drawdel]").forEach(b => b.onclick = () => act({ action: "deleteDraw", name: b.dataset.drawdel }, "Eintrag „" + b.dataset.drawdel + "“ aus der Kritzeln-Bestenliste löschen?"));
      const dcsv = $("#draw-csv"); if (dcsv) dcsv.onclick = () => downloadCsv("kritzeln-bestenliste.csv", (lastData.kritzeln || {}).entries || [], [{ k: "name", label: "Name" }, { k: "points", label: "Punkte" }, { k: "games", label: "Spiele" }, { k: "wins", label: "Siege" }, { k: "best", label: "Best" }]);
      // Wer-weiß's-Bestenliste + gemeldete Fragen bereinigen
      const qc = $("#quiz-clear"); if (qc) qc.onclick = () => { if (confirmType("LÖSCHEN", "Die GESAMTE Wer-weiß's-Bestenliste löschen?")) act({ action: "clearQuiz" }); };
      document.querySelectorAll("[data-quizdel]").forEach(b => b.onclick = () => act({ action: "deleteQuiz", name: b.dataset.quizdel }, "Eintrag „" + b.dataset.quizdel + "“ aus der Wer-weiß's-Bestenliste löschen?"));
      const qcsv = $("#quiz-csv"); if (qcsv) qcsv.onclick = () => downloadCsv("wer-weiss-bestenliste.csv", (lastData.quiz || {}).entries || [], [{ k: "name", label: "Name" }, { k: "points", label: "Punkte" }, { k: "games", label: "Spiele" }, { k: "wins", label: "Siege" }, { k: "best", label: "Best" }]);
      const qrc = $("#quiz-reports-clear"); if (qrc) qrc.onclick = () => act({ action: "clearQuizReports" }, "Alle gemeldeten Fragen aus dem Log löschen?");
      document.querySelectorAll("[data-reportdel]").forEach(b => b.onclick = () => act({ action: "deleteQuizReport", id: Number(b.dataset.reportdel) }, "Diese Meldung als erledigt entfernen?"));

      // Trend-Zeitraum
      document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { trendDays = Number(b.dataset.days); load(); });
      // Bestenliste je Spiel
      const bg = $("#board-game"); if (bg) bg.onchange = () => { boardGame = bg.value; boardRows = null; renderBoardOut(); loadBoard(); };
      // Suche
      const sq = $("#search-q"), sgo = $("#search-go");
      const doSearch = () => { searchQ = (sq.value || "").trim(); loadSearch(); };
      if (sgo) sgo.onclick = doSearch;
      if (sq) sq.onkeydown = e => { if (e.key === "Enter") doSearch(); };
      // Betreiber-Alarm speichern
      const asave = $("#alert-save"); if (asave) asave.onclick = async () => { const n = ($("#alert-name").value || "").trim(); const d = await act({ action: "setAlert", name: n }, null, true); if (d) alert(n ? ("Alarm aktiv für: " + n) : "Alarm deaktiviert"); };
    }

    $("#enter").addEventListener("click", () => { const k = $("#key").value.trim(); if (!k) return; localStorage.setItem(LS, k); $("#gate-msg").textContent = ""; load(); });
    $("#key").addEventListener("keydown", e => { if (e.key === "Enter") $("#enter").click(); });
    $("#refresh").addEventListener("click", load);
    $("#logout").addEventListener("click", () => { localStorage.removeItem(LS); showGate(); });
    $("#auto").addEventListener("change", () => { if ($("#auto").checked) startAuto(); else stopAuto(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopAuto(); else if (!$("#dash").hidden) { startAuto(); load(); } });

    // ---------- Tastaturkürzel ----------
    // Ein Betriebspanel bedient man im Vorbeigehen; die Maus soll dafür nicht
    // nötig sein. Greift nur außerhalb von Eingabefeldern.
    function toggleHelp(on) { $("#help").hidden = !on; }
    $("#help-btn").addEventListener("click", () => toggleHelp($("#help").hidden));
    $("#help").addEventListener("click", ev => { if (ev.target === $("#help")) toggleHelp(false); });

    document.addEventListener("keydown", ev => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if (ev.key === "Escape") return toggleHelp(false);
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
      if ($("#dash").hidden) return;
      const k = ev.key;
      if (k === "?") { ev.preventDefault(); toggleHelp($("#help").hidden); }
      else if (k === "r" || k === "R") { ev.preventDefault(); load(); }
      else if (k === "a" || k === "A") { const c = $("#auto"); c.checked = !c.checked; c.dispatchEvent(new Event("change")); }
      else if (k === "f" || k === "F") { if (lastData) { errView = errView === "top" ? "latest" : "top"; render(lastData); } }
      else if (k === "/") {
        ev.preventDefault();
        setView("moderation", true);            // die Suche wohnt in der Moderation
        const q = $("#search-q"); if (q) { q.focus(); q.select(); }
      }
      else if (k === "t" || k === "T") { trendDays = { 7: 30, 30: 90, 90: 7 }[trendDays] || 30; load(); }
      else if (k >= "1" && k <= "4") { setView(VIEW_IDS[Number(k) - 1], true); }
    });

    load();
  </script>
</body>
</html>
