<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0f14" />
  <title>Betrieb · Dashboard</title>
  <style>
    :root { --bg:#0c0f14; --card:#141a22; --line:#26303c; --ink:#eef3f8; --muted:#93a2b4; --accent:#4fd0e0; --ok:#37d38a; --warn:#ffb020; --bad:#ff5b4d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:920px; margin:0 auto; padding:20px 16px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    h1 { font-size:1.2rem; margin:0; letter-spacing:-.01em; } h1 span { color:var(--accent); }
    .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:9px 14px; font:700 .88rem inherit; cursor:pointer; }
    .btn.p { background:linear-gradient(160deg,var(--accent),#2ba7b8); color:#04121a; border:0; }
    .muted { color:var(--muted); } .mono { font-variant-numeric:tabular-nums; }
    .gate { max-width:420px; margin:12vh auto 0; text-align:center; }
    .gate input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; margin:10px 0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .card h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:800; }
    .big { font-size:1.9rem; font-weight:900; letter-spacing:-.02em; }
    .kv { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:.9rem; }
    .kv b { font-weight:700; }
    .pill { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 9px; border-radius:999px; }
    .pill.ok { background:rgba(55,211,138,.16); color:var(--ok); } .pill.warn { background:rgba(255,176,32,.16); color:var(--warn); } .pill.bad { background:rgba(255,91,77,.16); color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:.82rem; }
    td { padding:6px 6px; border-top:1px solid var(--line); vertical-align:top; }
    td.t { color:var(--muted); white-space:nowrap; } td.m { word-break:break-word; }
    .section-title { margin:22px 2px 10px; font-size:.95rem; font-weight:800; }
    .err { color:var(--bad); } .foot { margin-top:26px; color:var(--muted); font-size:.78rem; }
    .full { grid-column:1/-1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="gate" hidden>
      <h1>🔒 Betrieb</h1>
      <p class="muted">Zugriffsschlüssel eingeben.</p>
      <input id="key" type="password" placeholder="Schlüssel" autocomplete="off" />
      <button class="btn p" id="enter" style="width:100%">Anmelden</button>
      <p id="gate-msg" class="err" style="min-height:1.2em"></p>
    </div>

    <div id="dash" hidden>
      <header>
        <h1>Betrieb<span>·Dashboard</span></h1>
        <div>
          <button class="btn" id="refresh">↻ Aktualisieren</button>
          <button class="btn" id="logout">Abmelden</button>
        </div>
      </header>
      <p id="stamp" class="muted mono" style="margin-top:-8px;font-size:.8rem"></p>
      <div id="content"></div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const LS = "admin_key";
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const nf = n => (n == null ? "–" : Number(n).toLocaleString("de-AT"));
    function fmtAge(s) { if (s == null) return "–"; if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min"; return Math.round(s / 3600) + " h"; }

    async function load() {
      const key = localStorage.getItem(LS);
      if (!key) return showGate();
      let r, d;
      try { r = await fetch("/api/admin", { headers: { "x-admin-key": key } }); d = await r.json(); }
      catch { $("#gate-msg").textContent = "Netzwerkfehler."; return showGate(); }
      if (r.status === 401) { localStorage.removeItem(LS); $("#gate-msg").textContent = "Falscher Schlüssel."; return showGate(); }
      if (!r.ok) { render(null, d && d.error); return; }
      showDash(); render(d);
    }

    function showGate() { $("#dash").hidden = true; $("#gate").hidden = false; $("#key").focus(); }
    function showDash() { $("#gate").hidden = true; $("#dash").hidden = false; }

    function firePill(f) {
      if (f.ageSec == null) return '<span class="pill warn">unbekannt</span>';
      if (f.note && f.note !== "ok") return '<span class="pill bad">' + esc(f.note) + "</span>";
      if (f.ageSec > 900) return '<span class="pill warn">verzögert</span>';
      return '<span class="pill ok">ok</span>';
    }

    function render(d, errMsg) {
      if (!d) { $("#content").innerHTML = '<div class="card"><p class="err">' + esc(errMsg || "Fehler beim Laden") + "</p></div>"; return; }
      $("#stamp").textContent = "Stand: " + new Date(d.generatedAt).toLocaleString("de-AT");
      const s = d.scores, e = d.errors, p = d.push, f = d.fire, db = d.db;

      const gameRows = (s.games || []).map(g =>
        `<div class="kv"><span>${esc(g.game)} <span class="muted">· ${nf(g.players)} Spieler</span></span><b class="mono">${nf(g.subs)}</b></div>`
      ).join("") || '<p class="muted">keine</p>';

      const topRows = (s.games || []).filter(g => g.top > 0).map(g =>
        `<div class="kv"><span>${esc(g.game)}</span><b class="mono">${nf(g.top)} <span class="muted">${esc(g.topName || "")}</span></b></div>`
      ).join("") || '<p class="muted">keine</p>';

      const errList = (e.latest || []).map(x =>
        `<tr><td class="t">${esc((x.created_at || "").slice(5, 16))}</td><td class="m"><b>${esc(x.msg)}</b><br><span class="muted">${esc(x.page || "")}</span></td></tr>`
      ).join("") || '<tr><td class="muted" colspan="2">keine Fehler 🎉</td></tr>';

      $("#content").innerHTML = `
        <div class="grid">
          <div class="card"><h2>Scores</h2><div class="big mono">${nf(s.total)}</div><div class="kv"><span class="muted">letzte 24 h</span><b class="mono">${nf(s.last24h)}</b></div></div>
          <div class="card"><h2>JS-Fehler (24 h)</h2><div class="big mono ${e.last24h ? "err" : ""}">${nf(e.last24h)}</div><div class="kv"><span class="muted">gesamt gespeichert</span><b class="mono">${nf(e.total)}</b></div></div>
          <div class="card"><h2>Push</h2><div class="big mono">${nf(p.subscriptions)}</div><div class="kv"><span class="muted">Warteschlange</span><b class="mono">${nf(p.queued)}</b></div></div>
          <div class="card"><h2>Fire-Cron ${firePill(f)}</h2>
            <div class="kv"><span class="muted">letzter Lauf</span><b class="mono">${fmtAge(f.ageSec)}</b></div>
            <div class="kv"><span class="muted">aktive Einsätze</span><b class="mono">${nf(f.active)}</b></div>
            <div class="kv"><span class="muted">gespeichert</span><b class="mono">${nf(f.keptOps)}</b></div>
          </div>
        </div>

        <div class="grid" style="margin-top:12px">
          <div class="card"><h2>Einsendungen je Spiel</h2>${gameRows}</div>
          <div class="card"><h2>Weltrekorde</h2>${topRows}</div>
          <div class="card"><h2>DB-Hilfstabellen</h2>
            <div class="kv"><span class="muted">rate-Buckets</span><b class="mono">${nf(db.rateRows)}</b></div>
            <div class="kv"><span class="muted">verbrauchte Token</span><b class="mono">${nf(db.usedTokens)}</b></div>
          </div>
        </div>

        <div class="section-title">Letzte JS-Fehler</div>
        <div class="card full"><table>${errList}</table></div>
        <p class="foot">Rein private Betriebsübersicht. Kein Tracking Dritter, keine personenbezogenen Daten außer den frei gewählten Bestenlisten-Namen.</p>`;
    }

    $("#enter").addEventListener("click", () => {
      const k = $("#key").value.trim();
      if (!k) return;
      localStorage.setItem(LS, k); $("#gate-msg").textContent = ""; load();
    });
    $("#key").addEventListener("keydown", e => { if (e.key === "Enter") $("#enter").click(); });
    $("#refresh").addEventListener("click", load);
    $("#logout").addEventListener("click", () => { localStorage.removeItem(LS); showGate(); });

    load();
  </script>
</body>
</html>
